<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Character Studio — research</title><style>
*{box-sizing:border-box}body{margin:0;background:#dcd9cf;color:#282b27;font:15px system-ui,sans-serif}header{padding:16px 24px;background:#333d35;color:#fff;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font:600 20px Georgia,serif}main{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 60px)}aside{padding:20px;background:#f6f3eb;border-right:1px solid #b8b6aa;overflow:auto}label{display:block;margin:11px 0 4px;font-weight:600}select,input[type=range]{width:100%}select,button{border:1px solid #9a9c91;background:#f8f6ee;border-radius:4px;padding:8px;color:inherit;font:inherit}button{cursor:pointer}button:active{background:#ddd8c7}input{accent-color:#536b55}section{padding:16px;min-width:0}#views{display:flex;gap:12px;align-items:flex-start}#views>div{flex:1;min-width:0}#views svg{display:block;width:100%;height:auto;max-height:74vh}#compare:empty{display:none}.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:8px 0}#metrics{font:12px ui-monospace,monospace;white-space:pre-wrap;background:#f6f3eb;padding:10px;border-left:3px solid #6b7861}.note{font-size:12px;color:#66675f}#error{color:#9e362c;min-height:1em}@media(max-width:750px){main{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid #b8b6aa;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}aside .wide{grid-column:1/-1}section{padding:8px}}
</style><header><h1>Character Studio</h1><small>v0.4 • research / not approved</small></header><main><aside>
<div class="wide"><label for="sourceProfile">Anatomical source</label><select id="sourceProfile"><option value="native">Native geometry</option></select><p class="note" id="sourceNote">Optional MakeHuman source directory.</p></div><div><label for="species">Creature</label><select id="species"></select></div>
<div><label for="style">Art direction</label><select id="style"><option value="low-poly">Stylized Low Poly</option><option value="historical-miniature" selected>Historical Miniature</option><option value="anatomical-realism">Anatomical Realism (candidate)</option></select></div>
<div><label for="lod">LOD</label><select id="lod"><option>low</option><option selected>medium</option><option>high</option></select></div>
<div><label for="surface">Surface</label><select id="surface"><option value="transported">Transported rings</option><option value="legacy-rings">Legacy rings</option><option value="implicit">Implicit upper garment</option></select></div>
<div><label for="height">Height <output id="heightVal"></output></label><input id="height" type="range" min="65" max="140" value="100"></div>
<div><label for="build">Build <output id="buildVal"></output></label><input id="build" type="range" min="65" max="150" value="100"></div>
<div><label for="head">Head <output id="headVal"></output></label><input id="head" type="range" min="80" max="125" value="100"></div>
<div><label for="limb">Limb <output id="limbVal"></output></label><input id="limb" type="range" min="85" max="115" value="100"></div>
<div><label for="action">Action</label><select id="action"><option>idle</option><option>walk</option><option>run</option><option>fly</option><option>turn</option></select></div>
<div><label for="angle">Azimuth</label><input id="angle" type="range" min="0" max="360" value="35"></div>
<div class="wide"><label><input id="skeleton" type="checkbox"> Show skeleton</label><label><input id="correct" type="checkbox"> Sole correction (experimental)</label><label><input id="unarmed" type="checkbox"> Remove weapon / shield</label></div>
<div class="wide"><label><input id="neutral" type="checkbox" checked> Neutral light</label><label><input id="silhouette" type="checkbox"> Silhouette</label><label><input id="wireframe" type="checkbox"> Mesh edges</label><label><input id="contacts" type="checkbox"> Contact landmarks</label><label for="closeup">Detail view</label><select id="closeup"><option value="">Full body</option><option value="head">Head</option><option value="hands">Limb details</option></select></div><div class="wide" id="garmentControls" hidden><label for="kit">Garment kit</label><select id="kit"><option>shirt</option><option selected>tunic</option><option>traveler</option><option>warrior</option></select><label for="method">Garment construction</label><select id="method"><option>pattern</option><option>template</option><option selected>hybrid</option></select><label><input type="checkbox" id="hiddenBody"> Show concealed anatomical source</label><label><input type="checkbox" id="layer1" checked> Underlayers</label><label><input type="checkbox" id="layer2" checked> Outer layers</label><label><input type="checkbox" id="layer3" checked> Cloak</label><label><input type="checkbox" id="layer4" checked> Accessories</label><label><input type="checkbox" id="penetration"> Highlight approximate body intersections</label></div><div class="wide"><label for="phase">Matched animation phase</label><input id="phase" type="range" min="0" max="100" value="0"></div><div class="wide note">Geometry generated locally in browser. GLB export uses the same local research server. Drag the preview to rotate. No paid APIs.</div>
</aside><section><div class="toolbar"><label id="demoLabel" hidden>Research demonstrator <select id="demoPreset"><option value="">Studio builder</option><option value="walk">Artisan / Cyclic49</option><option value="hand">Artisan / C-matched index flexion</option></select></label><button id="play">Play</button><button id="pin">Pin comparison</button><button id="clear">Clear comparison</button><button id="exportSpec">Export spec</button><button id="exportModel">Export GLB</button></div><div id="error" role="alert"></div><div id="views"><div id="view"></div><div id="compare"></div></div><pre id="metrics"></pre></section></main>
<script type="module">
import {build,recipes} from './core.mjs';import {preview} from './preview.mjs';import {dress,draftGarments,bindTemplate,garmentAudit} from './garment.mjs';
const $=id=>document.getElementById(id),species=$('species');for(let r of Object.keys(recipes)){let o=document.createElement('option');o.value=o.textContent=r;species.append(o)}species.value='citizen';
let demoMorph=null,demoManifest=null;let model,spec,source=null,phase=0,playing=false,last=0,request=0,renderMs=0,pinned=null,pinnedSource=null,revision=0,diagnostics=null;const cache=new Map();async function loadSource(n){if(!cache.has(n)){let r=await fetch('/api/source?name='+encodeURIComponent(n));if(!r.ok)throw Error(await r.text());cache.set(n,await r.json())}return cache.get(n)}
function config(){if($('demoPreset').value)return {demonstrator:$('demoPreset').value};if($('sourceProfile').value!=='native')return {sourceProfile:$('sourceProfile').value,garment:{kit:$('kit').value,method:$('method').value,style:$('style').value,identity:{}}};let r=recipes[species.value];return {version:2,recipe:species.value,style:$('style').value,lod:$('lod').value,surface:$('surface').value,anatomy:'v4',motionRevision:'v4',seed:17,morphology:{height:r.height*Number($('height').value)/100,build:Number($('build').value)/100,head:Number($('head').value)/100,limb:Number($('limb').value)/100},actions:['idle','walk','run','fly','turn'],contactCorrection:$('correct').checked,modules:$('unarmed').checked?['unarmed']:[]}}
function viewModel(m,src,inspect=false){if(m===model&&demoMorph){const a=demoMorph.activation,t=phase*(a.length-1),i=Math.floor(t),u=t-i,w=a[i]*(1-u)+a[Math.min(i+1,a.length-1)]*u;return {...m,parts:m.parts.map(p=>p.name===demoMorph.part?{...p,positions:p.positions.map((x,k)=>x+demoMorph.delta[k]*w)}:p)}}if(!src)return m;let parts=m.parts.filter(p=>!p.layer||$('layer'+p.layer)?.checked);if($('hiddenBody').checked){parts=[{...src.parts[0],color:[.62,.45,.34]},...parts.filter(p=>p.name!==src.parts[0].name)]}
 if(inspect&&$('penetration').checked&&m.spec.style!=='low-poly'){let a=garmentAudit(src,m,[phase]);diagnostics=a[0]?.rows??[];let bad=new Set(diagnostics.filter(r=>r.negative>0).map(r=>r.part));parts=parts.map(p=>bad.has(p.name)?{...p,color:[.77,.13,.09]}:p)}return {...m,parts}}
function draw(){if(!model)return;let t=performance.now(),opts={action:model.spec.actions.includes($('action').value)?$('action').value:model.spec.actions[0],phase,azimuth:Number($('angle').value)*Math.PI/180,width:640,height:640,skeleton:$('skeleton').checked,neutral:$('neutral').checked,silhouette:$('silhouette').checked,wireframe:$('wireframe').checked,contacts:$('contacts').checked,closeup:$('closeup').value||null};diagnostics=null;$('view').innerHTML=preview(viewModel(model,source,!playing),opts).svg;if(pinned)$('compare').innerHTML=preview(viewModel(pinned,pinnedSource),{...opts,action:pinned.spec.actions.includes(opts.action)?opts.action:pinned.spec.actions[0]}).svg;renderMs=performance.now()-t;$('metrics').textContent=JSON.stringify({profile:spec.demonstrator??spec.sourceProfile??spec.recipe,demonstrator:spec.demonstrator?demoManifest:null,triangles:model.statistics.triangleCount,vertices:model.statistics.vertices,joints:model.joints.length,components:model.components.map(c=>c.name),geometryRigMs:model.statistics.geometryAndRigMs??model.statistics.garmentMs,previewMs:renderMs.toFixed(2),garment:spec.garment??null,phase:phase.toFixed(2),approximateBodyIntersection:diagnostics,approval:model.approval},null,2)}
async function regenerate(){let current=++revision;try{let next=config(),candidate,src=null,morph=null;if(next.demonstrator){const r=await fetch('/api/demonstrator?mode='+encodeURIComponent(next.demonstrator));if(!r.ok)throw Error(await r.text());const d=await r.json();candidate=d.model;morph=d.morph;$('action').value='walk'}else if(next.sourceProfile){src=await loadSource(next.sourceProfile);let temp=null;if(next.garment.method==='template'){let base=await loadSource('base');temp=bindTemplate(base,draftGarments(base,{...next.garment,method:'pattern'}))}candidate=dress(src,next.garment,temp)}else candidate=build(next);if(current!==revision)return;spec=next;model=candidate;source=src;demoMorph=morph;$('error').textContent='';$('garmentControls').hidden=!source;for(let n of ['species','height','build','head','limb','lod','surface','correct','unarmed'])$(n).disabled=!!source||!!next.demonstrator;if(!source&&!next.demonstrator)for(let n of ['height','build','head','limb'])$(n+'Val').value=n==='height'?spec.morphology.height.toFixed(2)+' m':($(n).value+'%');draw()}catch(e){if(current!==revision)return;$('error').textContent=e.message;model=null;$('view').textContent='No candidate: adjust specification';$('metrics').textContent=''}}
for(let id of ['demoPreset','species','style','lod','surface','height','build','head','limb','correct','unarmed','sourceProfile','kit','method'])$(id).addEventListener('input',()=>{cancelAnimationFrame(request);request=requestAnimationFrame(regenerate)});
for(let id of ['action','angle','skeleton','neutral','silhouette','wireframe','contacts','closeup','hiddenBody','layer1','layer2','layer3','layer4','penetration'])$(id).addEventListener('input',draw);
$('phase').oninput=()=>{phase=Number($('phase').value)/100;draw()};
$('pin').onclick=()=>{if(model){pinned=model;pinnedSource=source;draw()}};$('clear').onclick=()=>{pinned=null;pinnedSource=null;$('compare').textContent=''};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';if(playing)requestAnimationFrame(tick)};
function tick(t){if(!playing)return;if(t-last>125){phase=(phase+.125/(model?.spec.walkDuration??1.12))%1;$('phase').value=phase*100;last=t;draw()}requestAnimationFrame(tick)}
let drag=null;$('view').onpointerdown=e=>{drag=e.clientX;$('view').setPointerCapture(e.pointerId)};$('view').onpointerup=()=>drag=null;$('view').onpointermove=e=>{if(drag===null)return;$('angle').value=(Number($('angle').value)+(e.clientX-drag)*.7+360)%360;drag=e.clientX;draw()};
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportSpec').onclick=()=>{if(model)download(new Blob([JSON.stringify(spec,null,2)],{type:'application/json'}),'character-spec.json')};
$('exportModel').onclick=async()=>{if(!model)return;try{$('exportModel').disabled=true;let r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(spec)});if(!r.ok)throw Error(await r.text());download(await r.blob(),(spec.demonstrator?'v21-'+spec.demonstrator:spec.recipe??spec.sourceProfile)+'.glb');$('error').textContent=''}catch(e){$('error').textContent=e.message}finally{$('exportModel').disabled=false}};
await regenerate();try{let r=await fetch('/api/sources');for(let n of await r.json()){let o=document.createElement('option');o.value=o.textContent=n;$('sourceProfile').append(o)}if($('sourceProfile').options.length>1)$('sourceNote').textContent='Six prepared source morphs available.'}catch(e){$('sourceNote').textContent='Native only; set CHARACTER_SOURCE_DIR to enable source morphs.'}try{const r=await fetch('/api/demonstrator');demoManifest=await r.json();if(demoManifest)$('demoLabel').hidden=false}catch(e){/* optional research assets */}window.studioReady=true;
</script></html>
