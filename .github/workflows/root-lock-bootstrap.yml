name: Generate root dependency lockfile

on:
  push:
    branches: [platform/phase1-root-dependency-lock-20261024]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: root-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pin:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, '[root-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate registry-backed npm v10 lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(l.lockfileVersion!==3||l.packages[''].name!==p.name||l.packages[''].version!==p.version)process.exit(1); console.log('lock packages',Object.keys(l.packages).length)"
      - name: Verify clean install with locked versions
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm ls --depth=0 --all --legacy-peer-deps >/dev/null || true
      - name: Commit generated lockfile into feature branch
        run: |
          set -euo pipefail
          git config user.name "pocket-works-lockbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Root lockfile already current"
            exit 0
          fi
          git commit -m "build(platform): lock root and workspace dependency graph [root-lock]"
          git push origin HEAD:platform/phase1-root-dependency-lock-20261024
