name: AI Mobile Gameplay QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-mobile-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exploratory-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Match Playwright package to browser image
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund @playwright/test@1.55.0

      - name: Detect changed Pocket Works apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repository = process.env.GITHUB_REPOSITORY;
          const apiBase = process.env.GITHUB_API_URL || 'https://api.github.com';
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'pocket-works-ai-mobile-qa'
          };

          async function getJson(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${url}: ${await response.text()}`);
            }
            return response.json();
          }

          async function changedFiles() {
            if (event.pull_request?.number) {
              const files = [];
              for (let page = 1; page <= 30; page += 1) {
                const batch = await getJson(
                  `${apiBase}/repos/${repository}/pulls/${event.pull_request.number}/files?per_page=100&page=${page}`
                );
                files.push(...batch.map((item) => item.filename));
                if (batch.length < 100) break;
              }
              return files;
            }

            const zero = '0000000000000000000000000000000000000000';
            if (event.before && event.after && event.before !== zero) {
              const comparison = await getJson(`${apiBase}/repos/${repository}/compare/${event.before}...${event.after}`);
              return (comparison.files || []).map((item) => item.filename);
            }

            return [];
          }

          changedFiles().then((files) => {
            const targets = [...new Set(files
              .map((file) => /^apps\/([^/]+)\//.exec(file)?.[1])
              .filter((slug) => slug && !slug.startsWith('_')))]
              .sort();
            fs.appendFileSync(process.env.GITHUB_ENV, `PW_APP_TARGETS=${targets.join(',')}\n`);
            if (targets.length) {
              console.log(`Exploratory QA targets changed apps: ${targets.join(',')}`);
            } else {
              console.log('No changed app slug detected; exploratory QA will sample the newest active apps.');
            }
          }).catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Assemble production-like browser test site
        run: npm run build:quality-site

      - name: Run exploratory mobile gameplay
        shell: bash
        env:
          PW_AI_MAX_APPS: "6"
        run: |
          set -euo pipefail
          TESTS=(tests/e2e/ai-gameplay.spec.ts)
          if [[ ",${PW_APP_TARGETS:-}," == *",aetherwing,"* ]]; then
            TESTS+=(tests/e2e/aetherwing.spec.ts)
          fi
          if [[ ",${PW_APP_TARGETS:-}," == *",sirocco,"* ]]; then
            TESTS+=(tests/e2e/sirocco.spec.ts)
          fi
          if [[ ",${PW_APP_TARGETS:-}," == *",sinew,"* ]]; then
            TESTS+=(tests/e2e/sinew.spec.ts)
          fi
          npx playwright test "${TESTS[@]}"

      - name: Upload exploratory QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-mobile-qa-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
