name: Verified Gameplay Evidence Audit
on:
  pull_request:
    paths:
      - '.github/workflows/verified-gameplay-evidence-audit.yml'
      - 'scripts/ci-overhaul/verified-gameplay-*'
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed eight-shard source run ID
        required: true
        type: string
      historical_run:
        description: Completed eight-shard historical replay run ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ci-overhaul/verified-gameplay-evidence-audit.test.mjs
  audit:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate and reconstruct completed experiment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          HISTORICAL_RUN: ${{ inputs.historical_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$HISTORICAL_RUN" =~ ^[0-9]+$ ]]
          root="$RUNNER_TEMP/evidence"
          mkdir -p "$root"/{primary,same,historical}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$root/source.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORICAL_RUN" > "$root/replay.json"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {validateRuns} from "./scripts/ci-overhaul/verified-gameplay-evidence-audit.mjs"; const [a,b]=process.argv.slice(1);validateRuns(JSON.parse(readFileSync(a)),JSON.parse(readFileSync(b)));' "$root/source.json" "$root/replay.json"
          sha="$(jq -er '.head_sha' "$root/source.json")"
          a="$(jq -er '.run_attempt' "$root/source.json")"
          b="$(jq -er '.run_attempt' "$root/replay.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$a/jobs?per_page=100" > "$root/source-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORICAL_RUN/attempts/$b/jobs?per_page=100" > "$root/replay-jobs.json"
          for shard in {0..7}; do
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "verified-gameplay-input-$a-$shard" --dir "$root/primary/$shard/bundle"
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "verified-gameplay-receipt-$a-$shard" --dir "$root/primary/$shard"
            gh attestation verify "$root/primary/$shard/receipt.json" --repo "$GITHUB_REPOSITORY" --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/verified-gameplay-receipt.yml@refs/heads/main" --source-ref refs/heads/main --source-digest "$sha" --deny-self-hosted-runners
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "verified-gameplay-trial-$a-$shard" --dir "$root/same/$shard"
            gh run download "$HISTORICAL_RUN" --repo "$GITHUB_REPOSITORY" --name "gameplay-cross-run-$b-$shard" --dir "$root/historical/$shard"
          done
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "verified-gameplay-trial-aggregate-$a" --dir "$root/same-aggregate"
          gh run download "$HISTORICAL_RUN" --repo "$GITHUB_REPOSITORY" --name "gameplay-cross-run-aggregate-$b" --dir "$root/historical-aggregate"
          mv "$root/same-aggregate/aggregate.json" "$root/same-aggregate.json"
          mv "$root/historical-aggregate/aggregate.json" "$root/historical-aggregate.json"
          unset GH_TOKEN
          node scripts/ci-overhaul/verified-gameplay-evidence-audit.mjs "$root" "$RUNNER_TEMP/audit.json"
          cat "$RUNNER_TEMP/audit.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-gameplay-evidence-audit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error
          retention-days: 7
