name: Validate REDLINE VECTOR

on:
  pull_request:
    paths:
      - "apps/redline-vector/**"
      - ".github/workflows/redline-vector-ci.yml"

permissions:
  contents: read

jobs:
  validate-redline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile and audit REDLINE runtime
        run: |
          node --input-type=module <<'NODE'
          import { access, readFile } from 'node:fs/promises';
          import vm from 'node:vm';
          const root = 'apps/redline-vector';
          const required = ['app.config.json','index.html','styles.css','app.js','sw.js','manifest.webmanifest','icons/icon.svg', ...[1,2,3,4,5,6].map(n => `chunks/app-0${n}.txt`)];
          await Promise.all(required.map(file => access(`${root}/${file}`)));
          const chunks = [1,2,3,4,5,6].map(n => `${root}/chunks/app-0${n}.txt`);
          const source = (await Promise.all(chunks.map(file => readFile(file, 'utf8')))).join('');
          new vm.Script(source, { filename: 'redline-vector-runtime.js' });
          const config = JSON.parse(await readFile(`${root}/app.config.json`, 'utf8'));
          const manifest = JSON.parse(await readFile(`${root}/manifest.webmanifest`, 'utf8'));
          const html = await readFile(`${root}/index.html`, 'utf8');
          const css = await readFile(`${root}/styles.css`, 'utf8');
          const worker = await readFile(`${root}/sw.js`, 'utf8');
          const expected = {
            id: `/apps/${config.slug}/`, name: config.name, short_name: config.shortName,
            description: config.description, orientation: config.orientation,
            background_color: config.backgroundColor, theme_color: config.themeColor
          };
          for (const [key, value] of Object.entries(expected)) {
            if (manifest[key] !== value) throw new Error(`manifest ${key} mismatch`);
          }
          if (!worker.includes(`const CACHE_NAME='${config.cacheName}'`)) throw new Error('service worker cache name mismatch');
          if (!worker.includes(`'${config.slug}-'`)) throw new Error('service worker ownership prefix missing');
          for (const token of ['data-app-shell','viewport-fit=cover','data-action="pause"','id="touchControls"','id="rotateGate"']) {
            if (!html.includes(token)) throw new Error(`index token missing: ${token}`);
          }
          for (const token of ['touch-action:none','env(safe-area-inset-left)','@media (orientation:portrait)']) {
            if (!css.includes(token)) throw new Error(`mobile CSS token missing: ${token}`);
          }
          for (const token of ['pointerdown','pointerup','deviceorientation','visibilitychange','localStorage','requestAnimationFrame','AudioContext']) {
            if (!source.includes(token)) throw new Error(`runtime capability missing: ${token}`);
          }
          if (/https?:\/\//.test(source)) throw new Error('runtime contains an external dependency');
          console.log(`REDLINE audit passed: ${source.length} runtime characters, ${required.length} required assets`);
          NODE
          node --check apps/redline-vector/app.js
          node --check apps/redline-vector/sw.js

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Validate generated registry
        run: npm run registry:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run landscape mobile gameplay smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/redline-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 844, height: 390 }, isMobile: true, hasTouch: true, deviceScaleFactor: 2 });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
            await page.goto('http://127.0.0.1:4173/apps/redline-vector/', { waitUntil: 'networkidle' });
            await page.locator('#title:not([hidden])').waitFor({ timeout: 10000 });
            await page.click('[data-action="openModes"]');
            await page.click('[data-mode="time"]');
            await page.click('[data-action="launchRace"]');
            await page.locator('#raceHud:not([hidden])').waitFor();
            await page.keyboard.down('ArrowUp');
            await page.waitForTimeout(4700);
            const speed = Number(await page.locator('#speedValue').textContent());
            if (speed < 80) throw new Error(`Acceleration smoke failed: ${speed} km/h`);
            await page.keyboard.up('ArrowUp');
            await page.click('[data-action="pause"]');
            if (await page.locator('#pause').getAttribute('hidden') !== null) throw new Error('Pause menu did not open');
            await page.click('[data-action="resume"]');
            const racers = await page.locator('#racerCount').textContent();
            if (racers.trim() !== '1') throw new Error(`Time trial contains unexpected rivals: ${racers}`);
            if (errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
            console.log(`Gameplay smoke passed at ${speed} km/h`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
