name: Universal Cross Commit Delivery
on:
  pull_request:
    paths:
      - 'scripts/ci-overhaul/universal-cross-delivery*'
      - '.github/workflows/universal-cross-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ci-overhaul/universal-cross-delivery.test.mjs
  delivery:
    needs: contract
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'infra/universal-cross-commit-delivery'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: axis-pals
            target: '5c87f6448f2ec8a5eab0f9d1921651334d510e16'
          - app: press
            target: '5c87f6448f2ec8a5eab0f9d1921651334d510e16'
          - app: flickyard
            target: 'a00c4525d4b7714fdecea09602eb841753bb326c'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain independently authenticated issuer evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bash scripts/ci-overhaul/universal-cross-delivery-source.sh "$RUNNER_TEMP/source-evidence"; then
            rm -rf "$RUNNER_TEMP/source-evidence"
            echo "Source unavailable; fresh fallback"
          fi
      - name: Measure actual target, execute only fresh decisions
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tool="$PWD/scripts/ci-overhaul/universal-cross-commit.mjs"
          repo="$PWD"
          dir="$RUNNER_TEMP/delivery"; src="$RUNNER_TEMP/target-source"; out="$RUNNER_TEMP/target-output"
          mkdir "$dir" "$src" "$out"
          task="$(node "$tool" task "$APP")"
          key="$(jq -er .key <<< "$task")"
          git archive "$TARGET" "apps/$APP" shared scripts package.json package-lock.json | tar -xf - -C "$src"
          node "$tool" normalize "$repo" "$TARGET" "$APP" "$src" > "$dir/before.json"
          image='node@sha256:be979e5523c76fa4d5ca4ebd3099078f220aa47ec39c48ad5b5df9314debd6eb'
          docker pull "$image"
          opts=(--rm --network none --hostname pw-shadow --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=128m --user "$(id -u):$(id -g)" -e TZ=UTC -e LANG=C.UTF-8 -e HOME=/tmp)
          config="$(docker image inspect --format '{{.Id}}' "$image")"
          runtime="$(docker run "${opts[@]}" "$image" node -p 'process.version')"
          arch="$(docker run "${opts[@]}" "$image" node -p 'process.arch')"
          toolchain="$(docker run "${opts[@]}" "$image" sha256sum /usr/local/bin/node | cut -d' ' -f1)"
          kernel="$(uname -srvm | sha256sum | cut -d' ' -f1)"
          cpu="$(awk -F: '/^(vendor_id|cpu family|model[[:space:]]|model name|stepping|microcode|flags)[[:space:]]*:/{print}' /proc/cpuinfo | sort -u | sha256sum | cut -d' ' -f1)"
          jq -n --arg image "$image" --arg config "$config" --arg node "$runtime" --arg arch "$arch" --arg toolchain "$toolchain" --arg kernel "$kernel" --arg cpu "$cpu" --argjson uid "$(id -u)" --argjson gid "$(id -g)" '{image:$image,config:$config,node:$node,arch:$arch,toolchain:$toolchain,kernel:$kernel,cpu:$cpu,uid:$uid,gid:$gid}' > "$dir/runtime.json"
          docker run "${opts[@]}" --mount "type=bind,src=$src,dst=/work,readonly" "$image" node /work/scripts/ci-overhaul/verified-mounted-inputs.mjs measure /work > "$dir/inside.json"
          node scripts/ci-overhaul/universal-cross-delivery.mjs prepare "$APP" "$dir" "$RUNNER_TEMP/source-evidence"
          cat "$dir/decision.json"
          if jq -e '.mode=="verified-pilot"' "$dir/decision.json"; then
            echo "Verified pilot: fresh test command omitted"
          else
            jq -e '.mode=="fresh"' "$dir/decision.json"
            mkdir "$src/qa-artifacts"; touch -d @946684800 "$src"
            docker run "${opts[@]}" --mount "type=bind,src=$src,dst=/work,readonly" --mount "type=bind,src=$out,dst=/work/qa-artifacts" -w /work -e "PW_QA_TASK=$task" "$image" node scripts/universal-qa/run.mjs
            rmdir "$src/qa-artifacts"; touch -d @946684800 "$src"
            cp "$out/$key/result.json" "$out/$key/console.log" "$dir/"
          fi
          node "$tool" measure "$src" > "$dir/after.json"
          cmp "$dir/before.json" "$dir/after.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-delivery-${{ github.run_attempt }}-${{ matrix.app }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 7
  independent_gate:
    needs: delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-delivery-${{ github.run_attempt }}-*
          path: delivery
      - name: Independently obtain source and verify mixed coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! bash scripts/ci-overhaul/universal-cross-delivery-source.sh "$RUNNER_TEMP/source-evidence"; then
            rm -rf "$RUNNER_TEMP/source-evidence"
          fi
          node scripts/ci-overhaul/universal-cross-delivery.mjs gate all delivery "$RUNNER_TEMP/source-evidence" | tee gate.log
      - uses: actions/upload-artifact@v4
        with:
          name: cross-delivery-gate-${{ github.run_attempt }}
          path: gate.log
          if-no-files-found: error
  required_gate:
    if: always()
    needs: [contract, delivery, independent_gate]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CONTRACT: ${{ needs.contract.result }}
          DELIVERY: ${{ needs.delivery.result }}
          GATE: ${{ needs.independent_gate.result }}
        run: |
          test "$CONTRACT" = success
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && jq -e '.pull_request.head.repo.full_name == .repository.full_name and .pull_request.head.ref == "infra/universal-cross-commit-delivery"' "$GITHUB_EVENT_PATH"; then
            test "$DELIVERY" = success
            test "$GATE" = success
          else
            test "$DELIVERY" = skipped
            test "$GATE" = skipped
          fi
