name: Blockies gameplay QA

on:
  pull_request:
    paths:
      - 'apps/blockies/**'
      - 'pocketnet/module-versions/blockies/**'
      - 'pocketnet/modules.lock.json'
      - '.github/workflows/blockies-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/blockies/**'
      - 'pocketnet/module-versions/blockies/**'
      - 'pocketnet/modules.lock.json'

jobs:
  blockies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Blockies client modules
        run: |
          node --check apps/blockies/game.js
          node --check apps/blockies/network.js
          node --check apps/blockies/app.js
          node --check apps/blockies/sw.js
      - name: Run cooperative engine regression tests
        run: node --test apps/blockies/tests/board.test.mjs
      - name: Check pinned server module snapshots
        run: node scripts/build-pocketnet-modules.mjs --check
