name: ZAMAZKA editor tool matrix

on:
  pull_request:
    paths:
      - 'apps/zamazka/editor.js'
      - 'apps/zamazka/fill-raster-region.js'
      - 'apps/zamazka/qa/fill-colour-real-canvas.mjs'
      - 'apps/zamazka/qa/responsive-viewports.mjs'
      - 'apps/zamazka/qa/viewport-fit.mjs'
      - 'apps/zamazka/qa/visual-stage-regression.mjs'
      - 'apps/zamazka/fill-core.js'
      - 'apps/zamazka/qa/fill-matching-colour.mjs'
      - 'apps/zamazka/qa/all-tools-matrix.mjs'
      - 'apps/zamazka/qa/editor-input.mjs'
      - '.github/workflows/zamazka-tool-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'apps/zamazka/editor.js'
      - 'apps/zamazka/fill-raster-region.js'
      - 'apps/zamazka/qa/fill-colour-real-canvas.mjs'
      - 'apps/zamazka/qa/responsive-viewports.mjs'
      - 'apps/zamazka/qa/viewport-fit.mjs'
      - 'apps/zamazka/qa/visual-stage-regression.mjs'
      - 'apps/zamazka/fill-core.js'
      - 'apps/zamazka/qa/all-tools-matrix.mjs'
      - 'apps/zamazka/qa/editor-input.mjs'
      - '.github/workflows/zamazka-tool-matrix.yml'

permissions:
  contents: read

jobs:
  editor-tool-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise painting, erasing, fill, smudge, picking, pan, zoom and precision touch
        run: |
          node apps/zamazka/qa/all-tools-matrix.mjs
          node apps/zamazka/qa/fill-matching-colour.mjs
          node apps/zamazka/qa/fill-integrity.mjs
      - name: Install dedicated Chromium QA dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/zamazka-playwright" node_modules/@playwright
          printf '{"name":"zamazka-browser-qa","version":"1.0.0","private":true}' > "$RUNNER_TEMP/zamazka-playwright/package.json"
          npm install --prefix "$RUNNER_TEMP/zamazka-playwright" --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          ln -s "$RUNNER_TEMP/zamazka-playwright/node_modules/@playwright/test" node_modules/@playwright/test
          "$RUNNER_TEMP/zamazka-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate actual Canvas2D recolouring from saved strokes
        run: node apps/zamazka/qa/fill-colour-real-canvas.mjs
      - name: Validate real UI viewport layouts across desktop tablet and mobile
        run: |
          node apps/zamazka/qa/responsive-viewports.mjs
          node apps/zamazka/qa/viewport-fit.mjs
      - name: Validate real phase UI hierarchy and visual stage geometry
        run: node apps/zamazka/qa/visual-stage-regression.mjs
