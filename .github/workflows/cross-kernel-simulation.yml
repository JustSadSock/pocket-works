name: Cross Kernel Simulation Shadow
on:
  pull_request:
    paths:
      - '.github/workflows/cross-kernel-simulation.yml'
      - 'scripts/ci-overhaul/cross-kernel-simulation*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-kernel-simulation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
        kind: [crown, banners]
        include:
          - kind: crown
            app: crown-and-marches
            sha: 1ad4c63131d2ae3a46598da963d5a6101471687b
            task: '{"key":"crown-and-marches-balance-experiments-3","app":"crown-and-marches","suite":"balance-experiments","kind":"node","seed":3,"install":false}'
          - kind: banners
            app: banners-of-war
            sha: 11c8e8411b20e8465cafcc0bad51b1f0a6cff2d1
            task: '{"key":"banners-of-war-completion-lab-0","app":"banners-of-war","suite":"completion-lab","kind":"node","seed":0,"install":false}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ci-overhaul/full-simulation-repeatability.test.mjs scripts/ci-overhaul/cross-kernel-simulation.test.mjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: audit-source
          persist-credentials: false
      - name: Execute one complete original QA task on an independent runner
        env:
          APP: ${{ matrix.app }}
          KIND: ${{ matrix.kind }}
          SOURCE_SHA: ${{ matrix.sha }}
          TASK: ${{ matrix.task }}
          REPLICA: ${{ matrix.replica }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit-source rev-parse HEAD)" = "$SOURCE_SHA"
          src="$RUNNER_TEMP/full-source"
          out="$RUNNER_TEMP/full-output"
          mkdir -p "$src" "$out/1" "$out/plan" "$out/report"
          git -C audit-source archive HEAD "apps/$APP" shared scripts package.json package-lock.json > "$out/source.tar"
          archive="$(sha256sum "$out/source.tar" | cut -d' ' -f1)"
          tar -xf "$out/source.tar" -C "$src"
          mkdir "$src/qa-artifacts"
          image='node@sha256:be979e5523c76fa4d5ca4ebd3099078f220aa47ec39c48ad5b5df9314debd6eb'
          docker pull "$image"
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
          common=(--rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=128m --user "$(id -u):$(id -g)" -e TZ=UTC -e LANG=C.UTF-8 -e HOME=/tmp --mount "type=bind,src=$src,dst=/work,readonly" -w /work)
          if [ "$KIND" = banners ]; then
            docker run "${common[@]}" --mount "type=bind,src=$out/plan,dst=/plan" "$image" node --input-type=module -e 'import {numberCases} from "./apps/banners-of-war/numbers-lab.mjs";import {finalCases} from "./apps/banners-of-war/final-integration-lab.mjs";import {antiquityCases} from "./apps/banners-of-war/antiquity-lab.mjs";import {originalCases,extraCases,historicalCases} from "./apps/banners-of-war/completion-lab.mjs";import {writeFileSync} from "node:fs";const kinds=[...numberCases().map(()=>"numerical-superiority"),...originalCases().map(()=>"original"),...extraCases().map(()=>"independent"),...historicalCases().map(()=>"historical"),...antiquityCases().map(()=>"antiquity"),...finalCases().map(()=>"final-integration"),...[26,40,60,100,150].map(()=>"performance")].filter((_,i)=>i%8===0);writeFileSync("/plan/expected.json",JSON.stringify(kinds));'
          fi
          n=1
          config="$(docker image inspect --format '{{.Id}}' "$image")"
          runtime="$(docker run "${common[@]}" "$image" node -p 'process.version')"
          arch="$(docker run "${common[@]}" "$image" node -p 'process.arch')"
          toolchain="$(docker run "${common[@]}" "$image" sha256sum /usr/local/bin/node | cut -d' ' -f1)"
          kernel="$(uname -srvm)"
          cpu="$(awk -F: '/^model name/{sub(/^[ \t]+/,"",$2); print $2; exit}' /proc/cpuinfo)"
          jq -n --arg image "$image" --arg config "${config#sha256:}" --arg node "$runtime" --arg arch "$arch" --arg toolchain "$toolchain" --arg archive "$archive" --arg kernel "$kernel" --arg cpu "$cpu" --argjson uid "$(id -u)" --argjson gid "$(id -g)" '{image:$image,config:$config,node:$node,arch:$arch,toolchain:$toolchain,archive:$archive,kernel:$kernel,cpu:$cpu,uid:$uid,gid:$gid}' > "$out/environment.json"
            echo "Full original $KIND task, attempt $n"
            if ! docker run "${common[@]}" --mount "type=bind,src=$out/$n,dst=/work/qa-artifacts" -e "PW_QA_TASK=$TASK" "$image" node scripts/universal-qa/run.mjs > "$out/run-$n.log" 2>&1; then
              tail -c 12000 "$out/run-$n.log"
              exit 1
            fi
            key="$(jq -r .key <<< "$TASK")"
            jq -e '.success == true and .exitCode == 0 and .signal == null and .timedOut == false' "$out/$n/$key/result.json"

          node scripts/ci-overhaul/cross-kernel-simulation.mjs sample "$KIND" "$REPLICA" "$out/environment.json" "$out/1/$key" "$out/plan/expected.json" "$out/report"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.kind }}-${{ matrix.replica }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-output/report/
          if-no-files-found: error
          retention-days: 7
  compare:
    needs: audit
    if: always() && needs.audit.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: kernel-*-${{ github.run_attempt }}
          path: samples
      - name: Compare complete gameplay projections across runners
        env:
          MATRIX_RESULT: ${{ needs.audit.result }}
        run: node scripts/ci-overhaul/cross-kernel-simulation.mjs compare samples comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-kernel-comparison-${{ github.run_attempt }}
          path: comparison.json
          if-no-files-found: warn
          retention-days: 7
