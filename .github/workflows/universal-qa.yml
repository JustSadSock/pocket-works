name: Universal Pocket Works QA

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Application slug (or all, up to 20 total tasks)'
        required: true
        type: string
        default: living-history
      suite:
        description: 'Suite ID from app qa.plan.json or all'
        required: true
        type: string
        default: all
      profile:
        description: 'Smoke or deep testing'
        required: true
        type: choice
        options: [smoke, deep]
        default: smoke
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  attestations: read
  pull-requests: read

env:
  PW_QA_SPLIT_BANNERS: ${{ vars.PW_QA_SPLIT_BANNERS || '1' }}
  PW_QA_PRODUCTION_VERIFIED: ${{ vars.PW_QA_PRODUCTION_VERIFIED || '1' }}

concurrency:
  group: universal-qa-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'opened' &&
       github.event.issue.title == '[qa] pocket-works' &&
       github.event.issue.user.login == 'JustSadSock' &&
       github.actor == 'JustSadSock')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpu_matrix: ${{ steps.plan.outputs.cpu_matrix }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      has_cpu: ${{ steps.plan.outputs.has_cpu }}
      has_browser: ${{ steps.plan.outputs.has_browser }}
      expected: ${{ steps.plan.outputs.expected }}
      route: ${{ steps.route.outputs.route }}
      count: ${{ steps.route.outputs.count }}
      plan_digest: ${{ steps.route.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test planning and reporting infrastructure
        run: node --test scripts/universal-qa/platform.test.mjs scripts/universal-qa/eta.test.mjs scripts/universal-qa/branch-diff.test.mjs scripts/ci-overhaul/delivery-gate.test.mjs scripts/universal-qa/fresh-split.test.mjs scripts/ci-overhaul/gameplay-receipt-discovery.test.mjs scripts/ci-overhaul/gameplay-production-delivery.test.mjs
      - name: Prepare application QA matrix
        id: plan
        env:
          QA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/universal-qa/plan.mjs
      - name: Select delivery route (legacy default)
        id: route
        env:
          QA_CPU_MATRIX: ${{ steps.plan.outputs.cpu_matrix }}
          QA_BROWSER_MATRIX: ${{ steps.plan.outputs.browser_matrix }}
          QA_EXPECTED: ${{ steps.plan.outputs.expected }}
          PW_QA_ROUTE: ${{ vars.PW_QA_ROUTE }}
        run: node scripts/ci-overhaul/delivery-gate.mjs plan

  receipt_discovery:
    name: Discover signed Banners receipts (non-authorizing)
    needs: plan
    if: contains(needs.plan.outputs.expected, 'banners-of-war-completion-lab-') && (github.event_name != 'pull_request' || (github.event.pull_request.number == 1355 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      issuer: ${{ steps.discover.outputs.issuer }}
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover and authenticate candidate evidence
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          QA_EXPECTED: ${{ needs.plan.outputs.expected }}
          QA_PR_NUMBER: ${{ github.event.pull_request.number }}
          QA_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          QA_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci-overhaul/gameplay-receipt-discovery.mjs "$RUNNER_TEMP/receipt-discovery"
          report="$RUNNER_TEMP/receipt-discovery/discovery.json"
          if jq -e '.status=="authenticated-candidate"' "$report" >/dev/null; then echo "issuer=$(jq -er .issuer "$report")" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-discovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt-discovery/
          if-no-files-found: warn
          retention-days: 7

  renewable_admission:
    needs: [plan, receipt_discovery]
    if: vars.PW_QA_PRODUCTION_VERIFIED == '0' && vars.PW_QA_RENEWABLE_ADMISSION_SHADOW == '1' && needs.plan.result == 'success' && contains(needs.plan.outputs.expected, 'banners-of-war-completion-lab-') && github.event_name == 'pull_request' && github.event.pull_request.number == 1355 && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/gameplay-renewable-admission.yml
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    with:
      expected: ${{ needs.plan.outputs.expected }}

  cpu:
    needs: [plan, receipt_discovery]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.route == 'legacy' && needs.plan.outputs.has_cpu == 'true'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.cpu_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional Node dependencies
        if: matrix.install == true
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - uses: actions/download-artifact@v4
        id: signed_input
        if: ${{ env.PW_QA_PRODUCTION_VERIFIED == '1' && github.event_name == 'pull_request' && github.event.pull_request.number == 1355 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'app/banners-of-war' && matrix.app == 'banners-of-war' && matrix.suite == 'completion-lab' && matrix.kind == 'node' && matrix.install == false && needs.receipt_discovery.outputs.issuer != '' }}
        continue-on-error: true
        with:
          name: receipt-discovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt-discovery
      - uses: actions/checkout@v4
        id: controller
        if: steps.signed_input.outcome == 'success'
        continue-on-error: true
        with:
          ref: ${{ needs.receipt_discovery.outputs.issuer }}
          path: verified-controller
          persist-credentials: false
      - name: Attempt verified gameplay delivery
        id: verified
        if: steps.controller.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PW_QA_TASK: ${{ toJSON(matrix) }}
          QA_PR_NUMBER: ${{ github.event.pull_request.number }}
          QA_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          QA_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TASK_KEY: ${{ matrix.key }}
        shell: bash
        run: |
          status=0
          bash scripts/ci-overhaul/gameplay-production-delivery.sh "$PWD" "$PWD/verified-controller" "$RUNNER_TEMP/receipt-discovery" "$PWD/qa-artifacts/$TASK_KEY" || status=$?
          case "$status" in
            0) echo 'reuse=true' >> "$GITHUB_OUTPUT";;
            75) echo 'reuse=false' >> "$GITHUB_OUTPUT";;
            *) exit "$status";;
          esac
      - name: Run app-owned CPU QA
        if: steps.verified.outputs.reuse != 'true'
        env:
          PW_QA_TASK: ${{ toJSON(matrix) }}
        run: node scripts/universal-qa/run.mjs
      - name: Upload raw CPU results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.key }}
          path: qa-artifacts/${{ matrix.key }}/
          retention-days: 7
          if-no-files-found: warn

  browser:
    needs: plan
    if: needs.plan.outputs.route == 'legacy' && needs.plan.outputs.has_browser == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools and pinned Playwright runtime
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          node -e "if(require('@playwright/test/package.json').version!=='1.55.0')process.exit(1)"
      - name: Capture application browser QA
        env:
          PW_QA_TASK: ${{ toJSON(matrix) }}
        run: node scripts/universal-qa/run.mjs
      - name: Upload screenshots, traces and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.key }}
          path: qa-artifacts/${{ matrix.key }}/
          retention-days: 7
          if-no-files-found: warn

  summary:
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.route == 'legacy' && needs.plan.outputs.expected != '[]'
    needs: [plan, cpu, browser, receipt_discovery]
    outputs:
      report_digest: ${{ steps.report.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect all QA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qa-*
          path: qa-collected
          merge-multiple: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.receipt_discovery.outputs.issuer != ''
        continue-on-error: true
        with:
          name: receipt-discovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt-discovery
      - name: Independently verify every original task
        env:
          GH_TOKEN: ${{ github.token }}
          QA_CPU_MATRIX: ${{ needs.plan.outputs.cpu_matrix }}
          QA_BROWSER_MATRIX: ${{ needs.plan.outputs.browser_matrix }}
          QA_EXPECTED: ${{ needs.plan.outputs.expected }}
          QA_PR_NUMBER: ${{ github.event.pull_request.number }}
          QA_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          QA_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          QA_COLLECTED_DIR: qa-collected
        shell: bash
        run: |
          if find qa-collected -name verified-delivery.json -print -quit | grep -q .; then
            node scripts/ci-overhaul/gameplay-production-delivery.mjs mixed "$PWD" "$PWD/qa-collected" "$RUNNER_TEMP/receipt-discovery"
          else
            node scripts/universal-qa/aggregate.mjs
            QA_TREE=$(git rev-parse HEAD^{tree}) node scripts/ci-overhaul/delivery-gate.mjs legacy qa-collected/summary.json
          fi
      - name: Bind independent report to final delivery gate
        id: report
        run: echo "digest=$(sha256sum qa-collected/summary.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-summary-${{ github.run_id }}
          path: |
            qa-collected/summary.json
            qa-collected/SUMMARY.md
          if-no-files-found: warn
          retention-days: 7

  candidate:
    needs: plan
    if: needs.plan.outputs.route == 'sharded'
    uses: ./.github/workflows/qa-canary.yml
    permissions:
      contents: read
      actions: read
    with:
      delivery_route: true
      expected_plan_digest: ${{ needs.plan.outputs.plan_digest }}

  delivery_gate:
    name: Pocket Works CI Gate
    needs: [plan, cpu, browser, summary, candidate]
    if: always() && (github.event_name != 'issues' || needs.plan.result != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.route == 'legacy' && needs.summary.result == 'success'
        with:
          name: qa-summary-${{ github.run_id }}
          path: mandatory-report
      - name: Recheck bound original-plan delivery report
        if: needs.plan.outputs.route == 'legacy' && needs.summary.result == 'success'
        env:
          QA_CPU_MATRIX: ${{ needs.plan.outputs.cpu_matrix }}
          QA_BROWSER_MATRIX: ${{ needs.plan.outputs.browser_matrix }}
          QA_EXPECTED: ${{ needs.plan.outputs.expected }}
          QA_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          QA_REPORT_DIGEST: ${{ needs.summary.outputs.report_digest }}
          QA_PR_NUMBER: ${{ github.event.pull_request.number }}
          QA_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          QA_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/ci-overhaul/gameplay-production-delivery.mjs gate-report "$PWD" "$PWD/mandatory-report/summary.json"
      - name: Require complete selected route
        env:
          QA_PLAN_RESULT: ${{ needs.plan.result }}
          QA_ROUTE: ${{ needs.plan.outputs.route }}
          QA_COUNT: ${{ needs.plan.outputs.count }}
          QA_HAS_CPU: ${{ needs.plan.outputs.has_cpu }}
          QA_HAS_BROWSER: ${{ needs.plan.outputs.has_browser }}
          QA_CPU_RESULT: ${{ needs.cpu.result }}
          QA_BROWSER_RESULT: ${{ needs.browser.result }}
          QA_SUMMARY_RESULT: ${{ needs.summary.result }}
          QA_CANDIDATE_RESULT: ${{ needs.candidate.result }}
        run: node scripts/ci-overhaul/delivery-gate.mjs gate
