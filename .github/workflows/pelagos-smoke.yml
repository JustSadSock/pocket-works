name: Pelagos smoke

on:
  push:
    branches:
      - app/pelagos

permissions:
  contents: read

concurrency:
  group: pelagos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root toolchain
        run: npm install --no-audit --no-fund --workspaces=false

      - name: Install PELAGOS runtime dependency
        run: npm install --no-audit --no-fund --workspaces=false --prefix apps/pelagos

      - name: Typecheck PELAGOS
        run: npx tsc -p apps/pelagos/tsconfig.json --noEmit

      - name: Test PELAGOS
        run: npx vitest run --config apps/pelagos/vite.config.ts

      - name: Build and promote PELAGOS
        run: npm run build --prefix apps/pelagos

      - name: Validate promoted PELAGOS contract
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js styles.css manifest.webmanifest sw.js icons/icon.svg; do
            test -f "apps/pelagos/$file"
          done
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('apps/pelagos/app.config.json', 'utf8'));
          const manifest = JSON.parse(await readFile('apps/pelagos/manifest.webmanifest', 'utf8'));
          const checks = [
            [manifest.id === '/apps/pelagos/', 'manifest id'],
            [manifest.scope === './', 'manifest scope'],
            [manifest.start_url === './', 'manifest start_url'],
            [manifest.name === config.name, 'manifest name'],
            [manifest.description === config.description, 'manifest description'],
            [manifest.background_color === config.backgroundColor, 'manifest background'],
            [manifest.theme_color === config.themeColor, 'manifest theme']
          ];
          const failed = checks.filter(([ok]) => !ok).map(([, label]) => label);
          if (failed.length) throw new Error(`PELAGOS contract failed: ${failed.join(', ')}`);
          NODE

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: WebKit iPhone matrix
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/pelagos-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/apps/pelagos/ >/dev/null; then break; fi
            sleep 0.5
          done
          node --input-type=module <<'NODE'
          import { webkit } from '@playwright/test';
          const browser = await webkit.launch();
          const failures = [];
          const iphoneUA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 27_0 like Mac OS X) AppleWebKit/605.1.15 Version/27.0 Mobile/15E148 Safari/604.1';

          async function makePage(width, height) {
            const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 3, isMobile: true, hasTouch: true, userAgent: iphoneUA });
            const page = await context.newPage();
            page.on('pageerror', error => failures.push(`${width}x${height} pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') failures.push(`${width}x${height} console: ${message.text()}`); });
            await page.goto('http://127.0.0.1:4173/apps/pelagos/', { waitUntil: 'networkidle', timeout: 30000 });
            await page.locator('#menu:not(.hidden)').waitFor({ state: 'visible', timeout: 20000 });
            return { context, page };
          }

          async function assertViewport(page, label) {
            const result = await page.evaluate(() => {
              const viewport = { width: window.innerWidth, height: window.innerHeight };
              const ids = ['pauseButton', 'helmZone', 'trimZone', 'rowButton', 'telemetry'];
              const boxes = Object.fromEntries(ids.map(id => {
                const element = document.getElementById(id);
                if (!element || element.classList.contains('hidden')) return [id, null];
                const rect = element.getBoundingClientRect();
                return [id, { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom }];
              }));
              return { viewport, scrollWidth: document.documentElement.scrollWidth, scrollHeight: document.documentElement.scrollHeight, boxes };
            });
            if (result.scrollWidth > result.viewport.width + 1 || result.scrollHeight > result.viewport.height + 1) failures.push(`${label}: viewport overflow ${JSON.stringify(result)}`);
            for (const [id, box] of Object.entries(result.boxes)) {
              if (!box) continue;
              if (box.left < -1 || box.top < -1 || box.right > result.viewport.width + 1 || box.bottom > result.viewport.height + 1) failures.push(`${label}: ${id} outside viewport ${JSON.stringify(box)}`);
            }
          }

          // Primary modern iPhone: full functional path and visual artifact.
          {
            const { context, page } = await makePage(393, 852);
            await page.locator('#startButton').click();
            await page.locator('#hud:not(.hidden)').waitFor({ state: 'visible' });
            await page.waitForTimeout(4200);
            const speed = Number.parseFloat(await page.locator('#speedValue').innerText());
            if (!Number.isFinite(speed)) failures.push('393x852 speed telemetry is not finite');
            await assertViewport(page, '393x852 gameplay');
            const metrics = await page.evaluate(() => ({ fps: document.documentElement.dataset.fps ?? null, scale: document.documentElement.dataset.qualityScale ?? null }));
            console.log('PELAGOS WebKit adaptive metrics', metrics);
            await page.screenshot({ path: 'pelagos-sea-webkit.png', fullPage: true });
            await page.locator('#pauseButton').click();
            await page.locator('#pause:not(.hidden)').waitFor({ state: 'visible' });
            await page.locator('#resumeButton').click();
            await page.locator('#pause').waitFor({ state: 'hidden' });
            await page.locator('#pauseButton').click();
            await page.locator('#menuButton').click();
            await page.locator('#menu:not(.hidden)').waitFor({ state: 'visible' });
            await page.locator('#settingsButton').click();
            await page.locator('#settings:not(.hidden)').waitFor({ state: 'visible' });
            const beforeQuality = await page.locator('#qualityButton').innerText();
            await page.locator('#qualityButton').click();
            const afterQuality = await page.locator('#qualityButton').innerText();
            if (beforeQuality === afterQuality) failures.push('quality control did not change');
            await page.screenshot({ path: 'pelagos-settings-webkit.png', fullPage: true });
            await context.close();
          }

          // Fresh contexts avoid stale visualViewport data and represent actual small/large phones.
          for (const [width, height, shot] of [[375, 667, 'pelagos-small-webkit.png'], [430, 932, null]]) {
            const { context, page } = await makePage(width, height);
            await page.locator('#startButton').click();
            await page.locator('#hud:not(.hidden)').waitFor({ state: 'visible' });
            await page.waitForTimeout(1000);
            await assertViewport(page, `${width}x${height} gameplay`);
            if (shot) await page.screenshot({ path: shot, fullPage: true });
            await context.close();
          }

          await browser.close();
          if (failures.length) throw new Error(failures.join('\n'));
          NODE

      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pelagos-webkit-${{ github.sha }}
          path: |
            pelagos-sea-webkit.png
            pelagos-small-webkit.png
            pelagos-settings-webkit.png
          if-no-files-found: warn
          retention-days: 7
