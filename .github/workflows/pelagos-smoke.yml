name: Pelagos smoke

on:
  push:
    branches:
      - app/pelagos

permissions:
  contents: read

concurrency:
  group: pelagos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root toolchain
        run: npm install --no-audit --no-fund --workspaces=false

      - name: Install PELAGOS runtime dependency
        run: npm install --no-audit --no-fund --workspaces=false --prefix apps/pelagos

      - name: Typecheck PELAGOS
        run: npx tsc -p apps/pelagos/tsconfig.json --noEmit

      - name: Test PELAGOS
        run: npx vitest run --config apps/pelagos/vite.config.ts

      - name: Build PELAGOS
        run: npx vite build --config apps/pelagos/vite.config.ts

      - name: Validate Pocket Works integration
        run: npm run validate:configs && npm run validate:mobile && npm run validate:capabilities && npm run validate:enhanced
