name: Gameplay Production Admission Shadow
on:
  pull_request:
    paths:
      - '.github/workflows/gameplay-admission-policy.yml'
      - 'scripts/ci-overhaul/gameplay-admission-policy*'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ci-overhaul/gameplay-admission-policy.test.mjs
  shadow:
    needs: contract
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'infra/gameplay-production-admission-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: 2521b436264b904b4c7e88ac9e00a59c0cbbc688
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 45d6ce53df3cd5013a605bba972d94f1c0cd8dce
          path: controller/audit-source
          persist-credentials: false
      - name: Acquire and authenticate pinned evidence (fallback on failure)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/admission-evidence"
          mkdir -p "$evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45825802669" > "$evidence/upstream.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45835826339" > "$evidence/probe-run.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/1404" > "$evidence/pr.json"
          gh run download 45825802669 --repo "$GITHUB_REPOSITORY" --name "verified-gameplay-input-1-$SHARD" --dir "$evidence/bundle"
          gh run download 45825802669 --repo "$GITHUB_REPOSITORY" --name "verified-gameplay-receipt-1-$SHARD" --dir "$evidence"
          gh attestation verify "$evidence/receipt.json" --repo "$GITHUB_REPOSITORY" --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/verified-gameplay-receipt.yml@refs/heads/main" --source-ref refs/heads/main --source-digest 2521b436264b904b4c7e88ac9e00a59c0cbbc688 --deny-self-hosted-runners
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15127336596/zip" > "$RUNNER_TEMP/probe.zip"
          printf '%s  %s\n' d1c5999f3a080be7731ec9e90afc76450b667f9ecf6fed424e226e960fa79882 "$RUNNER_TEMP/probe.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/probe.zip" aggregate.json > "$evidence/probe.json"
          jq -n --argjson shard "$SHARD" '{sourceRun:45825802669,probeRun:45835826339,artifact:15127336596,shard:$shard}' > "$evidence/authenticated.json"
      - name: Execute policy shadow with mandatory fresh performance
        shell: bash
        run: |
          set -euo pipefail
          outer="$PWD"
          (
            cd controller
            test "$(git rev-parse HEAD)" = 2521b436264b904b4c7e88ac9e00a59c0cbbc688
            outer_sha="$GITHUB_SHA"
            export GITHUB_SHA=2521b436264b904b4c7e88ac9e00a59c0cbbc688
            source scripts/ci-overhaul/verified-gameplay-offline.sh
            prepare_gameplay source
            GITHUB_SHA="$outer_sha" node "$outer/scripts/ci-overhaul/gameplay-admission-policy.mjs" admit "$out" "$RUNNER_TEMP/admission-evidence" "$RUNNER_TEMP/decision.json"
            run_gameplay_phase performance
            if ! jq -e '.decision=="reuse-shadow" and .productionAuthorization==false and .allowResultReuse==false' "$RUNNER_TEMP/decision.json" >/dev/null; then
              run_gameplay_phase gameplay
            fi
            verify_gameplay_mounts
          )
          node scripts/ci-overhaul/gameplay-admission-policy.mjs finish "$RUNNER_TEMP/gameplay-output-source" "$RUNNER_TEMP/admission-evidence" "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/decision.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: warn
          retention-days: 7
  aggregate:
    needs: shadow
    if: always() && needs.shadow.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: admission-${{ github.run_attempt }}-*
          path: reports
      - run: node scripts/ci-overhaul/gameplay-admission-policy.mjs aggregate reports aggregate.json
        env:
          MATRIX_RESULT: ${{ needs.shadow.result }}
      - uses: actions/upload-artifact@v4
        with:
          name: admission-aggregate-${{ github.run_attempt }}
          path: aggregate.json
          if-no-files-found: error
          retention-days: 7
