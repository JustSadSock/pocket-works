name: Tihiy Kadr MRX Laboratory
on:
  pull_request:
    paths:
      - 'apps/tihiy-kadr/**'
      - '.github/workflows/tihiy-kadr-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/tihiy-kadr/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tihiy-kadr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and audio logic
        run: |
          node --check apps/tihiy-kadr/app.js
          node --check apps/tihiy-kadr/mrx-worker.js
          node --check apps/tihiy-kadr/audio-utils.js
          node --test apps/tihiy-kadr/qa/*.test.mjs
          node --input-type=module -e "import{readFileSync as r}from'node:fs';const a=JSON.parse(r('apps/tihiy-kadr/app.config.json'));const m=JSON.parse(r('apps/tihiy-kadr/manifest.webmanifest'));if(m.name!==a.name||m.description!==a.description||m.id!=='/apps/'+a.slug+'/')process.exit(1)"
  real-mrx:
    needs: syntax-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Separate synthetic video using actual 31 MB MRX ONNX model
        run: node apps/tihiy-kadr/qa/browser-smoke.mjs

  webkit-mrx:
    needs: syntax-unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit engine and media decoder
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps webkit
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
      - name: Run MRX in WebKit mobile viewport with actual video and ONNX WASM
        run: node apps/tihiy-kadr/qa/webkit-smoke.mjs
