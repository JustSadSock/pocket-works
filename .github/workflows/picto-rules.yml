name: Picto rules regression
on:
  pull_request:
    paths:
      - 'apps/picto/**'
      - 'pocketnet/module-versions/picto/**'
      - 'pocketnet/modules.lock.json'
      - '.github/workflows/picto-rules.yml'
  push:
    branches: [main]
    paths:
      - 'apps/picto/**'
      - 'pocketnet/module-versions/picto/**'
      - 'pocketnet/modules.lock.json'
      - '.github/workflows/picto-rules.yml'
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Picto JavaScript syntax
        run: |
          node --check apps/picto/app.js
          node --check apps/picto/symbols.js
          node --check apps/picto/sw.js
      - name: Test causal stories and complete games
        run: node --experimental-strip-types apps/picto/qa/rules.mjs
      - name: Validate immutable PocketNet versions
        run: node scripts/build-pocketnet-modules.mjs --check
