name: Fog Browser Check
on:
  push:
    branches:
      - app/fog-of-conquest-port-20261018
    paths:
      - .github/workflows/fog-browser-check.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated dependencies
        shell: bash
        run: |
          mkdir -p /tmp/fog-qa-node
          cd /tmp/fog-qa-node
          npm init -y
          npm install --no-audit --no-fund @playwright/test@1.55.0
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/fog-qa-node/node_modules node_modules
          node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Browser gameplay
        run: node_modules/.bin/playwright test --config apps/fog-of-conquest/qa/playwright.config.ts
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog-source-browser-qa
          path: |
            apps/fog-of-conquest/qa/fog-playwright-results
            apps/fog-of-conquest/qa/fog-playwright-report
          retention-days: 4
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/fog-browser-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove temporary Fog Browser Check'
          git push origin HEAD:app/fog-of-conquest-port-20261018
