name: Godot Web Runtime

on:
  push:
    paths:
      - "apps/**"
      - "scripts/build-godot.mjs"
      - "scripts/validate-godot.mjs"
      - "scripts/prepare-site.mjs"
      - "scripts/validate-site.mjs"
      - "scripts/validate-deploy-pipeline.mjs"
      - "scripts/app-config.mjs"
      - ".github/workflows/godot-web-runtime.yml"
  pull_request:
    paths:
      - "apps/**"
      - "scripts/build-godot.mjs"
      - "scripts/validate-godot.mjs"
      - "scripts/prepare-site.mjs"
      - "scripts/validate-site.mjs"
      - "scripts/validate-deploy-pipeline.mjs"
      - "scripts/app-config.mjs"
      - ".github/workflows/godot-web-runtime.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Optional registered Godot app slug to rebuild"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: godot-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[godot-export]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate runtime source before downloading Godot
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:scripts
          node scripts/app-config.test.mjs
          npm run test:forge:godot
          node scripts/validate-godot.mjs

      - name: Restore pinned Godot toolchain
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci/editor
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pocketworks-godot-web-4.7.2-linux-x86_64-v1

      - name: Install pinned Godot editor and Web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release="4.7.2-stable"
          editor="Godot_v${release}_linux.x86_64.zip"
          templates="Godot_v${release}_export_templates.tpz"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"

          mkdir -p "$RUNNER_TEMP/godot-download" .godot-ci/editor
          cd "$RUNNER_TEMP/godot-download"
          curl -fsSLO "${base}/${editor}"
          curl -fsSLO "${base}/${templates}"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          grep " ${editor}$" SHA512-SUMS.txt | sha512sum --check --strict
          grep " ${templates}$" SHA512-SUMS.txt | sha512sum --check --strict

          unzip -q "$editor" -d "$GITHUB_WORKSPACE/.godot-ci/editor"
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$templates" -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Resolve Godot binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$(find "$GITHUB_WORKSPACE/.godot-ci/editor" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Smoke-test the text-authored Godot template
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/pocketworks-godot-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          echo "Installed Web export templates:"
          find "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" -maxdepth 1 -type f -printf "%f\n" | sort
          "$GODOT_BIN" --verbose --headless --path apps/_godot-template --export-release Web "$smoke/index.html"
          test -s "$smoke/index.html"
          find "$smoke" -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          find "$smoke" -maxdepth 1 -type f -name '*.pck' -print -quit | grep -q .
          rm -rf apps/_godot-template/.godot

      - name: Smoke-test full Pocket Forge to Web pipeline
        shell: bash
        run: |
          set -euo pipefail
          slug="godot-ci-smoke"
          rm -rf "apps/$slug"
          trap 'rm -rf "apps/$slug"' EXIT

          node scripts/new-app.mjs "$slug" \
            --runtime=godot \
            --preset=godot-web \
            --name="Godot CI Smoke" \
            --orientation=landscape \
            --skip-health \
            --skip-build

          node scripts/build-godot.mjs --app "$slug"
          node scripts/validate-godot.mjs

          test -s "apps/$slug/web/index.html"
          test -s "apps/$slug/web/manifest.webmanifest"
          test -s "apps/$slug/web/sw.js"
          test -s "apps/$slug/web/pocketworks-build.json"
          find "apps/$slug/web" -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          find "apps/$slug/web" -maxdepth 1 -type f -name '*.pck' -print -quit | grep -q .
          grep -q 'pocketworks-godot-shell' "apps/$slug/web/index.html"
          grep -q "serviceWorker.register('./sw.js')" "apps/$slug/web/index.html"

      - name: Export affected Godot applications
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.app }}" ]]; then
            node scripts/build-godot.mjs --app "${{ inputs.app }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/build-godot.mjs --changed-from "${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            node scripts/build-godot.mjs --changed-from "${{ github.event.before }}"
          else
            echo "No app requested; template smoke test only."
          fi

      - name: Validate Godot runtime contract
        run: node scripts/validate-godot.mjs

      - name: Assemble and validate Pocket Works production output
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build:enhanced
          npm run prepare:site
          npm run validate:site
          rm -rf dist-site

      - name: Require committed exports in pull requests and main
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main')
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain -- 'apps/*/web')"
          if [[ -n "$dirty" ]]; then
            echo "Godot Web export is stale. Push the generated web/ output from the feature-branch workflow."
            echo "$dirty"
            exit 1
          fi

      - name: Commit generated exports back to feature branch
        if: (github.event_name == 'push' && github.ref_name != 'main') || (github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && inputs.app != '')
        shell: bash
        run: |
          set -euo pipefail
          find apps -mindepth 2 -maxdepth 2 -type d -name web -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Godot Web exports are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Godot Web exports [godot-export]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
