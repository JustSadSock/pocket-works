name: ОТВЕС spatial geometry

on:
  pull_request:
    paths:
      - 'apps/otves/**'
      - '.github/workflows/otves-spatial.yml'
  push:
    paths:
      - 'apps/otves/**'
      - '.github/workflows/otves-spatial.yml'

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/otves/app.js
          node --check apps/otves/renderer3d.js
          node --check apps/otves/render-geometry.js
          node --check apps/otves/sw.js
          node --check apps/otves/render-materials.js
          node --check apps/otves/qa/optics-smoke.mjs
      - name: Geometry regressions
        run: node --test apps/otves/render-geometry.test.mjs apps/otves/render-materials.test.mjs

  browser-optics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test optical tiers and WebGL2 rendering
        run: node apps/otves/qa/optics-smoke.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otves-optical-screenshots
          path: apps/otves/qa/evidence/*.png
          if-no-files-found: ignore
