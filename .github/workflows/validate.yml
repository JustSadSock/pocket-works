name: Validate Pocket Works

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new platform patch supersedes incomplete expensive builds for the same PR.
# Without this, each small fix runs a full production+WebKit matrix in parallel.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned PocketNet snapshots before expensive builds
        run: |
          npm run pocketnet:check
          npm run test:pocketnet:release

  creative-direction:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app design history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify rendered-image comparison diagnostics
        run: |
          python -m pip install Pillow==11.3.0
          python tools/visual-intelligence/test_images.py
      - name: Validate creative contract and Forge technical templates
        run: npm run validate:creative
      - name: Require a finished visual direction for visible app changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run validate:creative:changed

  platform-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate launcher modules and release regressions without dependencies
        run: |
          npm run validate:scripts
          npm run test:covers
          npm run validate:launcher
          node scripts/test-publish-policy.mjs

  production-packaging:
    needs: release-preflight
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'platform/') || contains(github.event.pull_request.labels.*.name, 'platform-change'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Use the same browser build as exploratory-mobile. A floating Playwright
    # install can otherwise change WebKit actionability independently of code.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application build dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Match Playwright package to browser image
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund @playwright/test@1.55.0
      - name: Assemble and validate published runtime assets
        run: npm run deploy:site
      - name: Verify iPhone launcher search, persistence and updates
        run: |
          npx playwright test tests/e2e/deck-layout-diagnostics.spec.ts --project=webkit-mobile-portrait --workers=1
          npx playwright test tests/e2e/pocket-deck.spec.ts tests/e2e/launcher-stage-two.spec.ts tests/e2e/launcher-stage-three.spec.ts --project=webkit-mobile-portrait
      - name: Upload Pocket Deck mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-deck-mobile-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

  change-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce isolated application PR scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOW_PLATFORM_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'platform-change') }}
        run: npm run validate:scope

  health:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Test ZAMAZKA untimed round gallery progression
        run: node apps/zamazka/qa/round-review.mjs

      - name: Test ZAMAZKA unconfirmed drawing and autosave recovery
        run: node apps/zamazka/qa/draft-recovery.mjs

      - name: Test ZAMAZKA own-paint picker and Space shortcut
        run: node apps/zamazka/qa/picker-snapshot.mjs

      - name: Test ZAMAZKA extended drawing timer and artwork provenance
        run: node apps/zamazka/qa/timing-provenance.mjs

      - name: Test ZAMAZKA host-configured drawing time
        run: node apps/zamazka/qa/drawing-time.mjs

      - name: Test ZAMAZKA rejoin, uploads, and canvas performance
        run: node apps/zamazka/qa/experience-reliability.mjs

      - name: Test ZAMAZKA multipart paintings and PocketNet frame limit
        run: node apps/zamazka/qa/large-painting.mjs
      - name: Verify acknowledged draft suffix transfer and full fallback
        run: node apps/zamazka/qa/draft-delta-transfer.mjs

      - name: Test ZAMAZKA final transfer checksum and interrupted upload recovery
        run: node apps/zamazka/qa/final-transfer-recovery.mjs

      - name: Test eight interleaved ZAMAZKA artwork uploads
        run: node apps/zamazka/qa/eight-player-transfer.mjs
      - name: Test three-round eight-player ZAMAZKA lifecycle and transfer resume
        run: node apps/zamazka/qa/full-match-recovery.mjs
      - name: Endure five full rounds with eight seats
        run: ZAMAZKA_SOAK_ROUNDS=5 node apps/zamazka/qa/full-match-recovery.mjs

      - name: Test ZAMAZKA raster cache invalidation after vector compaction
        run: node apps/zamazka/qa/editor-raster-invalidation.mjs
      - name: Test ZAMAZKA geometry-preserving budget compaction
        run: node apps/zamazka/qa/editor-geometry-compaction.mjs
      - name: Check dense 24k-point brush budget without geometry loss
        run: node apps/zamazka/qa/editor-budget-soak.mjs
      - name: Verify flood-fill ROI against full-sized pixel reference
        run: node apps/zamazka/qa/fill-raster-region.mjs
      - name: Verify smudge pixel parity and measured rendering time
        run: node apps/zamazka/qa/smudge-pixel-parity.mjs
      - name: Check compact smudge stencil matches original on 120 cases
        run: node apps/zamazka/qa/smudge-mask-crop.mjs
      - name: Check source buffer reuse across 171 smudge stamps
        run: node apps/zamazka/qa/smudge-scratch-reuse.mjs
      - name: Verify mobile compositor reuses compact smudge mask across frames
        run: node apps/zamazka/qa/smudge-mask-lifecycle.mjs
      - name: Verify compositor reuse under 60 brush revisions and 120 pointer frames
        run: node apps/zamazka/qa/editor-frame-reuse.mjs
      - name: Verify unchanged high-DPI canvas frames are skipped
        run: node apps/zamazka/qa/editor-frame-idle.mjs
      - name: Verify coalesced stationary pointers do not schedule redraws
        run: node apps/zamazka/qa/editor-pointer-dedup.mjs
      - name: Verify opt-in mobile frame profiler and latency percentiles
        run: node --test apps/zamazka/qa/frame-performance.test.mjs

      - name: Test ZAMAZKA smudge, uninterrupted strokes and touch budgets
        run: node apps/zamazka/qa/editor-input.mjs && node apps/zamazka/qa/smudge.mjs

      - name: Test ZAMAZKA cursor alignment and pointer recovery
        run: node apps/zamazka/qa/coordinate-input.mjs

      - name: Test ZAMAZKA flood fill and contour edge quality
        run: node apps/zamazka/qa/fill-seams.mjs

      - name: Test ZAMAZKA art readiness, vote receipts and archive constraints
        run: node apps/zamazka/qa/ux-reliability.mjs

      - name: Build published Enhanced apps
        run: npm run build:enhanced

      - name: Validate self-registering app manifests
        run: npm run registry:check

      - name: Check script syntax
        run: npm run validate:scripts

      - name: Validate app configs
        run: npm run validate:configs

      - name: Validate PWA structure
        run: npm run validate

      - name: Validate independent app contracts and report all failures
        run: |
          node --test scripts/validate-all-independent.test.mjs
          node scripts/validate-all-independent.mjs --contracts-only

      - name: Upload explicit legacy validation debt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-validation-debt
          path: quality-artifacts/validation-debt
          if-no-files-found: warn
          retention-days: 14

      - name: Test published Enhanced apps
        run: npm run test:enhanced

      - name: Smoke-test Quick presets
        run: npm run test:forge:quick

      - name: Smoke-test Godot source preset
        run: npm run test:forge:godot

      - name: Assemble production site and generated registry
        run: npm run prepare:site

      - name: Validate production site
        run: npm run validate:site

  enhanced-presets:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --legacy-peer-deps --silent --no-audit --no-fund

      - name: Generate, build and test Enhanced presets
        run: npm run test:forge:enhanced

      - name: Upload Enhanced smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-smoke-report
          path: enhanced-smoke-report.txt
          if-no-files-found: error
          retention-days: 14

  browser-quality:
    needs: health
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile-portrait, webkit-mobile-portrait, chromium-mobile-landscape, webkit-mobile-landscape]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Assemble browser test site
        run: npm run build:quality-site

      - name: Run Playwright mobile matrix
        run: npm run test:e2e -- --project="${{ matrix.project }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  lighthouse:
    needs: health
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Assemble Lighthouse site
        run: npm run build:quality-site

      - name: Run Lighthouse budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            quality-artifacts/lighthouse
            .lighthouseci
          if-no-files-found: warn
          retention-days: 14
