name: Validate Pocket Works

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new platform patch supersedes incomplete expensive builds for the same PR.
# Without this, each small fix runs a full production+WebKit matrix in parallel.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  creative-direction:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app design history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate creative contract and Forge technical templates
        run: npm run validate:creative
      - name: Require a finished visual direction for visible app changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run validate:creative:changed

  platform-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate launcher modules and release regressions without dependencies
        run: |
          npm run validate:scripts
          npm run validate:launcher
          node scripts/test-publish-policy.mjs

  production-packaging:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'platform/') || contains(github.event.pull_request.labels.*.name, 'platform-change'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application build dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Assemble and validate published runtime assets
        run: npm run deploy:site
      - name: Install WebKit for iPhone launcher smoke
        run: npx playwright install --with-deps webkit
      - name: Verify iPhone launcher search, persistence and updates
        run: npx playwright test tests/e2e/pocket-deck.spec.ts tests/e2e/launcher-stage-two.spec.ts tests/e2e/launcher-stage-three.spec.ts --project=webkit-mobile-portrait
      - name: Upload Pocket Deck mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-deck-mobile-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

  change-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce isolated application PR scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOW_PLATFORM_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'platform-change') }}
        run: npm run validate:scope

  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build published Enhanced apps
        run: npm run build:enhanced

      - name: Validate self-registering app manifests
        run: npm run registry:check

      - name: Check script syntax
        run: npm run validate:scripts

      - name: Validate app configs
        run: npm run validate:configs

      - name: Validate PWA structure
        run: npm run validate

      - name: Validate mobile runtime
        run: npm run validate:mobile

      - name: Validate managed updates
        run: npm run validate:updates

      - name: Validate launcher shelf
        run: npm run validate:launcher

      - name: Validate shared capabilities
        run: npm run validate:capabilities

      - name: Validate Enhanced runtime
        run: npm run validate:enhanced

      - name: Validate Godot source contract
        run: npm run validate:godot

      - name: Validate browser quality contract
        run: npm run validate:quality

      - name: Test published Enhanced apps
        run: npm run test:enhanced

      - name: Smoke-test Quick presets
        run: npm run test:forge:quick

      - name: Smoke-test Godot source preset
        run: npm run test:forge:godot

      - name: Assemble production site and generated registry
        run: npm run prepare:site

      - name: Validate production site
        run: npm run validate:site

  enhanced-presets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --legacy-peer-deps --silent --no-audit --no-fund

      - name: Generate, build and test Enhanced presets
        run: npm run test:forge:enhanced

      - name: Upload Enhanced smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-smoke-report
          path: enhanced-smoke-report.txt
          if-no-files-found: error
          retention-days: 14

  browser-quality:
    needs: health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Assemble browser test site
        run: npm run build:quality-site

      - name: Run Playwright mobile matrix
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  lighthouse:
    needs: health
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Assemble Lighthouse site
        run: npm run build:quality-site

      - name: Run Lighthouse budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            quality-artifacts/lighthouse
            .lighthouseci
          if-no-files-found: warn
          retention-days: 14
