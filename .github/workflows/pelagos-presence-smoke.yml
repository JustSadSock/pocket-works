name: Pelagos Presence Smoke

on:
  push:
    branches:
      - feature/pelagos-presence-pass

permissions:
  contents: read

jobs:
  pelagos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use stable npm 11
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck PELAGOS
        run: npm run typecheck --workspace @pocket-works/pelagos
      - name: Test PELAGOS
        run: npm run test --workspace @pocket-works/pelagos
      - name: Build PELAGOS
        run: npm run build --workspace @pocket-works/pelagos
      - name: Validate production site pipeline
        run: npm run deploy:site
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Start promoted PELAGOS build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/pelagos > /tmp/pelagos-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pelagos-preview.log
          exit 1
      - name: WebKit presence smoke
        run: |
          node --input-type=module <<'JS'
          import { webkit } from '@playwright/test';
          import fs from 'node:fs';
          const sizes = [[375,667],[393,852],[430,932]];
          const browser = await webkit.launch();
          fs.mkdirSync('pelagos-presence-artifacts', { recursive: true });
          for (const [width,height] of sizes) {
            const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
            await page.locator('#menu').waitFor({ state: 'visible', timeout: 30000 });
            await page.locator('#startButton').click();
            await page.locator('#hud').waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(6500);
            const canvas = page.locator('#renderCanvas');
            const box = await canvas.boundingBox();
            if (!box || box.width < width - 2 || box.height < height - 2) throw new Error(`Canvas does not fill ${width}x${height}: ${JSON.stringify(box)}`);
            if (errors.length) throw new Error(`${width}x${height}: ${errors.join('\n')}`);
            await page.screenshot({ path: `pelagos-presence-artifacts/presence-${width}x${height}.png`, fullPage: true });
            if (width === 393) {
              const row = page.locator('#rowButton');
              await row.dispatchEvent('pointerdown', { pointerId: 51, pointerType: 'touch', isPrimary: true, buttons: 1 });
              await page.waitForTimeout(2800);
              await page.screenshot({ path: 'pelagos-presence-artifacts/presence-rowing-393x852.png', fullPage: true });
              await row.dispatchEvent('pointerup', { pointerId: 51, pointerType: 'touch', isPrimary: true, buttons: 0 });
            }
            if (errors.length) throw new Error(`${width}x${height}: ${errors.join('\n')}`);
            await context.close();
          }
          await browser.close();
          JS
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pelagos-presence-screenshots
          path: pelagos-presence-artifacts
          if-no-files-found: warn
