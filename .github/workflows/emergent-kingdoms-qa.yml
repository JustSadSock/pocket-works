name: Emergent Kingdoms QA
on:
  pull_request:
    paths:
      - 'apps/emergent-kingdoms/**'
      - '.github/workflows/emergent-kingdoms-qa.yml'
  push:
    branches: [app/emergent-kingdoms]
    paths:
      - 'apps/emergent-kingdoms/**'
      - '.github/workflows/emergent-kingdoms-qa.yml'
jobs:
  simulation-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 1000-year deterministic simulation tests
        run: node --test apps/emergent-kingdoms/engine.test.mjs
      - name: Install isolated browser
        run: |
          npm install --prefix /tmp/ek-playwright playwright@1.55.0
          /tmp/ek-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Test real desktop and mobile browser
        env:
          PLAYWRIGHT_PATH: /tmp/ek-playwright/node_modules/playwright
        run: node apps/emergent-kingdoms/browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emergent-kingdoms-qa
          path: /tmp/ek-qa
          if-no-files-found: ignore
