name: ZAMAZKA colour fill real canvas

on:
  pull_request:
    paths:
      - 'apps/zamazka/editor.js'
      - 'apps/zamazka/fill-core.js'
      - 'apps/zamazka/qa/fill-colour-real-canvas.mjs'
      - '.github/workflows/zamazka-colour-fill.yml'
  push:
    branches: [main]
    paths:
      - 'apps/zamazka/editor.js'
      - 'apps/zamazka/fill-core.js'
      - 'apps/zamazka/qa/fill-colour-real-canvas.mjs'
      - '.github/workflows/zamazka-colour-fill.yml'

permissions:
  contents: read

jobs:
  chromium-recolour:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright in an isolated runner directory
        run: |
          mkdir -p "$RUNNER_TEMP/zamazka-playwright" node_modules/@playwright
          printf '{"name":"zamazka-browser-qa","version":"1.0.0","private":true}' > "$RUNNER_TEMP/zamazka-playwright/package.json"
          npm install --prefix "$RUNNER_TEMP/zamazka-playwright" --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          ln -s "$RUNNER_TEMP/zamazka-playwright/node_modules/@playwright/test" node_modules/@playwright/test
      - name: Install real Chromium Canvas2D
        run: |
          "$RUNNER_TEMP/zamazka-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Reproduce opaque tan field and black multi-gesture outline
        run: node apps/zamazka/qa/fill-colour-real-canvas.mjs
