name: Perekos QA

on:
  pull_request:
    paths:
      - 'apps/perekos/**'
      - 'pocketnet/module-versions/perekos/**'
      - 'pocketnet/modules.lock.json'
      - '.github/workflows/perekos-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/perekos/**'
      - 'pocketnet/module-versions/perekos/**'
      - '.github/workflows/perekos-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perekos-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify classes, server snapshot, fair draws and full game loops
        run: node --test apps/perekos/tests/*.test.mjs

  visual-and-gameplay:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          node -e "if(require('@playwright/test/package.json').version!=='1.55.0')process.exit(1)"
      - name: New elemental laboratory fast smoke gate
        env:
          PW_QA_SITE_ROOT: ${{ github.workspace }}
          PW_QA_OUTPUT_DIR: ${{ github.workspace }}/qa-artifacts/perekos-journey
        run: |
          node node_modules/@playwright/test/cli.js test --config=scripts/universal-qa/playwright.config.mjs \
            apps/perekos/qa/magic-v2-lab.spec.js --project=desktop-chromium --project=mobile-chromium --project=mobile-webkit
      - name: Browser journey and screenshot review (Chromium/WebKit, mobile/PC)
        env:
          PW_QA_SITE_ROOT: ${{ github.workspace }}
          PW_QA_OUTPUT_DIR: ${{ github.workspace }}/qa-artifacts/perekos-journey
        run: |
          node node_modules/@playwright/test/cli.js test --config=scripts/universal-qa/playwright.config.mjs \
            apps/perekos/qa/journey.spec.js \
            apps/perekos/qa/hud-arena.spec.js \
            apps/perekos/qa/magic-v2-lab.spec.js \
            apps/perekos/qa/avatar.spec.js \
            apps/perekos/qa/net.spec.js \
            apps/perekos/qa/visual-review.spec.js \
            apps/perekos/qa/character-overhaul.spec.js \
            apps/perekos/qa/eight-direction.spec.js \
            apps/perekos/qa/art-direction.spec.js \
            apps/perekos/qa/aim-precision.spec.js \
            apps/perekos/qa/kinetics.spec.js
      - name: Upload real browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perekos-current-visual-evidence
          path: qa-artifacts/perekos-journey/
          retention-days: 14
          if-no-files-found: warn

  balance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure mirrored school matchups with seeded bot policies
        env:
          PEREKOS_AUDIT_OUT: qa-artifacts/perekos-matchups/report.json
        run: node apps/perekos/qa/magic-v2-matchup-audit.mjs
      - name: Save machine-readable matchup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perekos-magic-v2-matchups
          path: qa-artifacts/perekos-matchups/report.json
          retention-days: 14
          if-no-files-found: warn
