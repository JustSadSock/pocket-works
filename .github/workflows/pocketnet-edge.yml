name: PocketNet Edge

on:
  pull_request:
    paths:
      - 'pocketnet/**'
      - 'pocket-id/**'
      - 'pocket-cloud/**'
      - 'pocket-social/**'
      - 'shared/pocket-social.js'
      - 'scripts/test-pocket-social.mjs'
      - 'apps/folio/**'
      - 'apps/zamazka/**'
      - 'shared/capabilities/cloud.js'
      - 'shared/capabilities/cloud.test.mjs'
      - 'shared/pocket-id.js'
      - 'shared/pocket-id.css'
      - 'apps/*/server/**'
      - 'scripts/build-pocketnet-modules.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'privacy.html'
      - '.github/workflows/pocketnet-edge.yml'
  push:
    branches: [main]
    paths:
      - 'pocketnet/**'
      - 'pocket-id/**'
      - 'pocket-cloud/**'
      - 'apps/folio/**'
      - 'apps/zamazka/**'
      - 'shared/capabilities/cloud.js'
      - 'shared/capabilities/cloud.test.mjs'
      - 'shared/pocket-id.js'
      - 'shared/pocket-id.css'
      - 'apps/*/server/**'
      - 'scripts/build-pocketnet-modules.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'privacy.html'
      - '.github/workflows/pocketnet-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebSocket test driver
        run: npm ci --prefix pocket-server --no-audit --no-fund
      - name: Validate and generate immutable module registry
        run: |
          npm run build:pocketnet
          node --check pocketnet/hub.mjs
          node --check pocketnet/worker.mjs
          node --check pocket-id/hub.mjs
          node --check pocket-cloud/hub.mjs
          node --check pocket-social/hub.mjs
          node --check shared/pocket-social.js
          node scripts/test-pocket-social.mjs
          node --check shared/capabilities/cloud.js
          node shared/capabilities/cloud.test.mjs
          node apps/folio/test-cloud-sync.mjs
          node apps/folio/test-collab.mjs
          node --check apps/folio/collab.js
          node --check apps/folio/app.js
          node --check apps/folio/cloud-sync.js
          node --check apps/zamazka/cloud-sync.js
          node --check shared/pocket-id.js
          node --check shared/capabilities/identity.js
          node shared/capabilities/identity.test.mjs
          node --check pocketnet/test/identity.mjs
          node --check scripts/build-pocketnet-modules.mjs
          node --check apps/zamazka/app.js
          node apps/zamazka/test-room-code.mjs
          node --check apps/zamazka/emblem.js
          node apps/zamazka/test-emblem.mjs
          node --check apps/zamazka/museum-motion.js
          node --check apps/zamazka/commons-board.js
          node apps/zamazka/test-gallery-commons.mjs
      - name: Install Wrangler 4
        run: npm install --prefix /tmp/pocketnet-wrangler --no-audit --no-fund wrangler@4
      - name: Compile Worker and verify Durable Object configuration
        run: |
          mkdir -p dist-site
          printf '<!doctype html><title>Edge CI</title>' > dist-site/index.html
          cp privacy.html dist-site/privacy.html
          cp privacy.html dist-site/privacy.txt
          /tmp/pocketnet-wrangler/node_modules/.bin/wrangler deploy --assets ./dist-site/ --dry-run --outdir /tmp/pocketnet-bundle
      - name: Test real local Worker, SQLite, WebSocket and rooms
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pocketnet-wrangler/node_modules/.bin/wrangler dev --local --port 8787 > /tmp/pocketnet-dev.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/pocketnet-dev.log | tail -n 100' EXIT
          node pocket-id/test/edge.mjs
          node pocket-cloud/test/edge.mjs
          node pocketnet/test/identity.mjs
          node pocketnet/test/edge.mjs
          node pocketnet/test/flagpost.mjs
      - name: Install real Fog browser QA and copy authentic app assets
        run: |
          mkdir -p dist-site/apps
          cp -R apps/fog-of-conquest dist-site/apps/fog-of-conquest
          cp -R shared dist-site/shared
          mkdir -p /tmp/fog-real-browser
          npm install --prefix /tmp/fog-real-browser --no-audit --no-fund @playwright/test@1.55.0
          /tmp/fog-real-browser/node_modules/.bin/playwright install --with-deps chromium
          ln -s /tmp/fog-real-browser/node_modules node_modules
      - name: FoC real Durable Object and independent browser reconnection scenarios
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pocketnet-wrangler/node_modules/.bin/wrangler dev --local --port 8787 > /tmp/pocketnet-fog.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -n 120 /tmp/pocketnet-fog.log' EXIT
          node pocketnet/test/fog-real-worker.mjs
          node_modules/.bin/playwright test --config apps/fog-of-conquest/qa/worker.config.ts

