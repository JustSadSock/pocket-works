name: Ne Tem Golosom Final Regression

on:
  push:
    branches: [main]
    paths:
      - 'apps/ne-tem-golosom/**'
      - 'apps/tihiy-kadr/mrx-worker.js'
      - 'apps/tihiy-kadr/artifact-repair.js'
      - 'apps/tihiy-kadr/selective-scnet.js'
      - 'pocketnet/module-versions/ne-tem-golosom/**'
      - '.github/workflows/ne-tem-golosom-qa.yml'
  pull_request:
    paths:
      - 'apps/ne-tem-golosom/**'
      - 'apps/tihiy-kadr/mrx-worker.js'
      - 'apps/tihiy-kadr/artifact-repair.js'
      - 'apps/tihiy-kadr/selective-scnet.js'
      - 'pocketnet/module-versions/ne-tem-golosom/**'
      - '.github/workflows/ne-tem-golosom-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ne-tem-golosom-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check every production module
        run: |
          node --check apps/ne-tem-golosom/recording-audio.js
          node --check apps/ne-tem-golosom/app.js
          node --check apps/ne-tem-golosom/screen-debug.js
          node --check apps/ne-tem-golosom/media-lab.js
          node --check apps/ne-tem-golosom/film-cleanup.js
          node --check apps/ne-tem-golosom/film-buzz-worker.js
          node --check apps/ne-tem-golosom/timeline-model.js
          node --check apps/ne-tem-golosom/trim-range.js
          node --check apps/ne-tem-golosom/studio-feedback.js
          node --check apps/ne-tem-golosom/media-protocol.js
          node --check apps/ne-tem-golosom/premiere-export.js
          node --check apps/ne-tem-golosom/sw.js
      - name: Run game, transport, and PocketNet module regression
        run: node --test apps/ne-tem-golosom/qa/*.test.mjs
      - name: Assert the production server snapshot matches the pinned v4 module
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';const live=readFileSync('apps/ne-tem-golosom/server/module.ts','utf8');const pin=readFileSync('pocketnet/module-versions/ne-tem-golosom/v4.ts','utf8');const lock=JSON.parse(readFileSync('pocketnet/modules.lock.json','utf8'));if(live!==pin||lock['ne-tem-golosom'].current!=='v4')process.exit(1);"

  real-browser:
    needs: unit-and-server
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install chromium
      - name: Check video source selection, trim, transcoding and browser appearance
        run: node apps/ne-tem-golosom/qa/video-journey.mjs
      - name: Verify real Open-Unmix, regional SCNet and full SCNet soundtrack exports
        run: node apps/ne-tem-golosom/qa/film-neural-journey.mjs
      - name: Record actual microphone audio in desktop and mobile browser emulation
        run: node apps/ne-tem-golosom/qa/recording-browser.mjs
      - name: Check timeline gestures, draft recovery and Undo/Redo
        run: node apps/ne-tem-golosom/qa/timeline-journey.mjs
      - name: Inspect all screen states on desktop and phone without room side effects
        run: node apps/ne-tem-golosom/qa/debug-gallery.mjs
      - name: Generate and decode real two-actor premiere movie
        run: node apps/ne-tem-golosom/qa/premiere-journey.mjs
      - name: Retain media and desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ne-tem-golosom-media-qa
          path: |
            /tmp/ntg-video-journey/
            /tmp/ntg-timeline-journey/
          if-no-files-found: ignore
          retention-days: 14

  real-pocketnet:
    needs: unit-and-server
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebSocket and module tooling
        run: npm ci --prefix pocket-server --no-audit --no-fund
      - name: Prepare isolated PocketNet modules
        run: |
          node scripts/build-pocketnet-modules.mjs --snapshot
          node scripts/build-pocketnet-modules.mjs --check
      - name: Install isolated Wrangler local runtime
        run: npm install --prefix /tmp/ntg-wrangler --no-audit --no-fund wrangler@4
      - name: Validate two real authenticated sockets and v3 relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-site
          printf '<!doctype html><title>NTG PocketNet QA</title>' > dist-site/index.html
          cp privacy.html dist-site/privacy.html
          cp privacy.html dist-site/privacy.txt
          /tmp/ntg-wrangler/node_modules/.bin/wrangler dev --local --port 8787 > /tmp/ntg-pocketnet-worker.log 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true; tail -n 90 /tmp/ntg-pocketnet-worker.log' EXIT
          node apps/ne-tem-golosom/qa/pocketnet-live.mjs
      - name: Save local PocketNet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ne-tem-golosom-pocketnet-runtime
          path: /tmp/ntg-pocketnet-worker.log
          if-no-files-found: warn
          retention-days: 14
