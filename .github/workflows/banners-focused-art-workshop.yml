name: Banners of War Focused Art Workshop
on:
  pull_request:
    paths:
      - 'apps/banners-of-war/research/battlefield-identity/workshop/**'
      - '.github/workflows/banners-focused-art-workshop.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: banners-focused-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-art:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: hand-library
            script: hand-library.py
            motion: static-gear
          - label: sword-static
            script: anatomical-motion.py
            motion: static-gear
          - label: archer-static
            script: archer-motion.py
            motion: anchor
    env:
      BLENDER_VERSION: '5.2.1'
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/reset-${{ matrix.label }}
      BOW_MOTION_REV: '0'
      BOW_WORKSHOP_MOTION: ${{ matrix.motion }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45672121448
          artifact-ids: 15050357382
          path: /tmp/bow-source
      - name: Prepare verified Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils fonts-dejavu-core ffmpeg libgl1 libx11-6 libxi6 libxrender1
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Acquire accepted anatomical hand
        run: python3 apps/banners-of-war/research/battlefield-identity/workshop/fetch-hand-source.py
      - name: Render static candidate only
        run: |
          python3 -m compileall -q apps/banners-of-war/research/battlefield-identity/workshop/
          source="$(find /tmp/bow-source -name spearman.blend -print -quit)"
          test -n "$source"
          "$BLENDER" --background --disable-autoexec "$source" --threads 2 --python-exit-code 1 --python apps/banners-of-war/research/battlefield-identity/workshop/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-reset-${{ matrix.label }}
          path: quality-artifacts/reset-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14

  native-animation:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        clip: [walk, run, slash, guard, transition]
    env:
      BLENDER_VERSION: '5.2.1'
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/reset-motion-${{ matrix.clip }}
      BOW_MOTION_REV: '0'
      BOW_REFERENCE_MOTION: ${{ matrix.clip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45672121448
          artifact-ids: 15050357382
          path: /tmp/bow-source
      - name: Prepare verified Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils fonts-dejavu-core ffmpeg libgl1 libx11-6 libxi6 libxrender1
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Download and hash pinned CC0 source release
        run: python3 apps/banners-of-war/research/battlefield-identity/workshop/fetch-animation-source.py
      - name: Compare original and unarmed retarget
        run: |
          source="$(find /tmp/bow-source -name spearman.blend -print -quit)"
          test -n "$source"
          "$BLENDER" --background --disable-autoexec "$source" --threads 2 --python-exit-code 1 --python apps/banners-of-war/research/battlefield-identity/workshop/reference-motion.py
      - name: Encode short synchronized source comparison
        if: always()
        run: python3 apps/banners-of-war/research/battlefield-identity/workshop/encode-reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-reset-motion-${{ matrix.clip }}
          path: quality-artifacts/reset-motion-${{ matrix.clip }}
          if-no-files-found: error
          retention-days: 14

  gait-history:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      BLENDER_VERSION: '5.2.1'
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/reset-gait-history
      BOW_MOTION_REV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45672121448
          artifact-ids: 15050357382
          path: /tmp/bow-source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45797022162
          artifact-ids: 15109641527,15107240174
          path: /tmp/previous-gaits
      - name: Prepare verified Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils fonts-dejavu-core ffmpeg libgl1 libx11-6 libxi6 libxrender1
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Read original IV gait evidence
        run: python3 apps/banners-of-war/research/battlefield-identity/workshop/review-previous-gaits.py
      - name: Resolve original CMU capture
        run: python3 apps/banners-of-war/research/battlefield-identity/workshop/fetch-mocap.py
      - name: Compare original capture support travel
        run: |
          source="$(find /tmp/bow-source -name spearman.blend -print -quit)"
          test -n "$source"
          "$BLENDER" --background --disable-autoexec "$source" --threads 2 --python-exit-code 1 --python apps/banners-of-war/research/battlefield-identity/workshop/cmu-source-slip.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-reset-gait-history
          path: quality-artifacts/reset-gait-history
          if-no-files-found: error
          retention-days: 14

  nature-reference:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        view: [A, B]
    env:
      BLENDER_VERSION: '5.2.1'
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/reset-nature-${{ matrix.view }}
      BOW_NATURE_VIEW: ${{ matrix.view }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45693373840
          artifact-ids: 15059369113
          path: /tmp/bow-art-baseline
      - name: Restore known scanned surfaces and authoritative terrain
        run: |
          mkdir -p "$BOW_ART_OUTPUT"
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path('/tmp/bow-art-baseline');out=Path(os.environ['BOW_ART_OUTPUT'])
          for n in ['grass.png','sparse.png','road.png','stone.png','terrain-provenance.json']:
              f=list(root.rglob(n));assert len(f)==1,n;shutil.copyfile(f[0],out/n)
          PY
          node apps/banners-of-war/research/battlefield-identity/workshop/relief-patch.mjs
      - name: Acquire verified CC0 scanned nature sources
        run: |
          python3 apps/banners-of-war/research/battlefield-identity/workshop/fetch-relief-scans.py
          python3 apps/banners-of-war/research/battlefield-identity/workshop/fetch-nature.py
      - name: Prepare verified Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils fonts-dejavu-core ffmpeg libgl1 libx11-6 libxi6 libxrender1
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Produce editable artistic reference
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 4 --python-exit-code 1 --python apps/banners-of-war/research/battlefield-identity/workshop/reference-landscape.py
      - name: Art Forge licensed model round trip in isolated staging
        if: matrix.view == 'A'
        run: python3 apps/banners-of-war/research/battlefield-identity/workshop/forge-reference-source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-reset-nature-${{ matrix.view }}
          path: |
            quality-artifacts/reset-nature-${{ matrix.view }}/*.png
            quality-artifacts/reset-nature-${{ matrix.view }}/*.blend
            quality-artifacts/reset-nature-${{ matrix.view }}/*.json
            quality-artifacts/reset-nature-${{ matrix.view }}/*.log
            quality-artifacts/reset-nature-${{ matrix.view }}/*.glb
            quality-artifacts/reset-nature-${{ matrix.view }}/nature/*.json
          if-no-files-found: error
          retention-days: 14

  paired-zoom:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - atlas: reference
            run: 45726607204
            artifact: 15074364271
            baseline: 616acb24cd7da44d90fc16bb9bc67d64cf353c81
          - atlas: living
            run: 45731469010
            artifact: 15077971441
            baseline: 9a235c0c003ed150ebaa77340fd8964df1d5c731
    defaults:
      run:
        shell: bash
    env:
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/paired-${{ matrix.atlas }}/frozen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.baseline }}
          path: .paired-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          artifact-ids: ${{ matrix.artifact }}
          path: /tmp/bow-frozen-atlas
      - name: Restore frozen atlas and terrain bytes, no production
        run: |
          mkdir -p "$BOW_ART_OUTPUT"
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          root=Path('/tmp/bow-frozen-atlas');out=Path(os.environ['BOW_ART_OUTPUT'])
          a=list(root.rglob('mixed-atlas.json'));assert len(a)==1,a
          parent=a[0].parent;meta=json.loads(a[0].read_text())
          names=['mixed-atlas.json','grass.png','sparse.png','road.png','stone.png']+[f'{k}.{ext}' for k in ['tree1','tree2','tree3','bush'] for ext in ['png','json']]+['page-'+str(k)+'.png' for k in meta['pages']]
          for name in names:
              p=parent/name;assert p.is_file(),name;shutil.copyfile(p,out/name)
          PY
      - name: Compare revisions sequentially on the same runner
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund --no-package-lock @playwright/test@1.64.0
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/.paired-baseline/node_modules"
          root="$GITHUB_WORKSPACE"
          script="$root/apps/banners-of-war/research/battlefield-identity/workshop/paired-zoom.mjs"
          frozen="$BOW_ART_OUTPUT"
          parent="$(dirname "$frozen")"
          for pair in baseline:cold current:cold current:warm baseline:warm; do
            revision="${pair%:*}"
            protocol="${pair#*:}"
            dest="$parent/$revision-$protocol"
            mkdir -p "$dest"
            cp -al "$frozen/." "$dest/"
            work="$root"
            expected="${{ github.sha }}"
            if [ "$revision" = baseline ]; then work="$root/.paired-baseline"; expected="${{ matrix.baseline }}"; fi
            (
              cd "$work"
              sha256sum apps/banners-of-war/engine.js apps/banners-of-war/research/battlefield-identity/{capture.mjs,battle-art.js,slice.js,slice-renderer.js,terrain-tiles.js,motion.js} > "$dest/runtime-sha256.txt"
              BOW_EXPECTED_REVISION="$expected" BOW_PROVENANCE_DEST="$dest" python3 "$root/apps/banners-of-war/research/battlefield-identity/workshop/verify-revision.py" || exit 1
              BOW_ART_OUTPUT="$dest" BOW_BENCH_REVISION="$expected" BOW_BENCH_PROTOCOL="$protocol" node "$script"
            ) || echo "Runner failure for $pair" >> "$parent/runner-failures.txt"
          done
          BOW_PAIR_ROOT="$parent" python3 "$root/apps/banners-of-war/research/battlefield-identity/workshop/paired-summary.py"
      - name: Analyze frame stages even when acceptance fails
        if: always()
        run: BOW_PAIR_ROOT="$(dirname "$BOW_ART_OUTPUT")" python3 apps/banners-of-war/research/battlefield-identity/workshop/profile-stages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-reset-paired-${{ matrix.atlas }}
          path: |
            quality-artifacts/paired-${{ matrix.atlas }}/*/paired-result.json
            quality-artifacts/paired-${{ matrix.atlas }}/*/runtime-sha256.txt
            quality-artifacts/paired-${{ matrix.atlas }}/*/canvas-readback-diagnostic.json
            quality-artifacts/paired-${{ matrix.atlas }}/*/source-provenance.json
            quality-artifacts/paired-${{ matrix.atlas }}/*/difference-*.png
            quality-artifacts/paired-${{ matrix.atlas }}/*summary.json
            quality-artifacts/paired-${{ matrix.atlas }}/*failures.txt
          if-no-files-found: error
          retention-days: 14

