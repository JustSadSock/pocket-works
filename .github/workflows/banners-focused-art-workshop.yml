name: Banners of War Focused Art Workshop
on:
  pull_request:
    paths:
      - 'apps/banners-of-war/research/battlefield-identity/workshop/**'
      - '.github/workflows/banners-focused-art-workshop.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: banners-focused-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sword:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BLENDER_VERSION: '5.2.1'
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/focused-sword
      BOW_MOTION_REV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45672121448
          artifact-ids: 15050357382
          path: /tmp/bow-source
      - name: Prepare verified Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils fonts-dejavu-core ffmpeg libgl1 libx11-6 libxi6 libxrender1
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Cheap single-character march and strike diagnostic
        run: |
          mkdir -p "$BOW_ART_OUTPUT"
          python3 -m py_compile apps/banners-of-war/research/battlefield-identity/workshop/sword-motion.py
          source="$(find /tmp/bow-source -name spearman.blend -print -quit)"
          test -n "$source"
          "$BLENDER" --background --disable-autoexec "$source" --threads 2 --python-exit-code 1 --python apps/banners-of-war/research/battlefield-identity/workshop/sword-motion.py
      - name: Encode completed original frame cycles
        if: always()
        run: |
          python3 - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          from PIL import Image
          folder=Path(os.environ['BOW_ART_OUTPUT'])/'sword'/'focused'
          if not folder.is_dir():raise SystemExit(0)
          clips=[]
          for name,fps in [('march',12),('strike',8)]:
              frames=[folder/('%s-%02d.png'%(name,i)) for i in range(12)]
              if not all(p.is_file() for p in frames):continue
              d=folder/(name+'-video');d.mkdir(exist_ok=True)
              for i in range(36):
                  with Image.open(frames[i%12]) as src:
                      im=Image.new('RGBA',src.size,(158,164,140,255));im.alpha_composite(src.convert('RGBA'));im.convert('RGB').save(d/('%04d.png'%i))
              file=folder/(name+'.mp4')
              subprocess.run(['ffmpeg','-y','-v','error','-framerate',str(fps),'-i',str(d/'%04d.png'),'-c:v','libx264','-crf','18','-pix_fmt','yuv420p',str(file)],check=True)
              clips.append({'motion':name,'file':file.name,'fps':fps,'sourceFrames':12,'loops':3})
              import shutil;shutil.rmtree(d)
          (folder/'clip-index.json').write_text(json.dumps(clips,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-sword-motion
          path: quality-artifacts/focused-sword
          if-no-files-found: error
          retention-days: 14

  relief:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BLENDER_VERSION: '5.2.1'
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/focused-relief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45693373840
          artifact-ids: 15059369113
          path: /tmp/bow-art-baseline
      - name: Restore accepted scanned ground materials
        run: |
          mkdir -p "$BOW_ART_OUTPUT"
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path('/tmp/bow-art-baseline');out=Path(os.environ['BOW_ART_OUTPUT'])
          for n in ['grass.png','sparse.png','road.png','stone.png','terrain-provenance.json']:
              f=list(root.rglob(n));assert len(f)==1,n;shutil.copyfile(f[0],out/n)
          PY
      - name: Export fixed physical terrain
        run: node apps/banners-of-war/research/battlefield-identity/workshop/relief-patch.mjs
      - name: Prepare verified Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils fonts-dejavu-core ffmpeg libgl1 libx11-6 libxi6 libxrender1
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Render one focused landscape
        run: |
          python3 -m py_compile apps/banners-of-war/research/battlefield-identity/workshop/relief-render.py
          "$BLENDER" --background --factory-startup --disable-autoexec --threads 4 --python-exit-code 1 --python apps/banners-of-war/research/battlefield-identity/workshop/relief-render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-historic-relief
          path: quality-artifacts/focused-relief
          if-no-files-found: error
          retention-days: 14

  zoom-audit:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - atlas: reference
            artifact: 15077287955
            tactical: '0'
          - atlas: living
            artifact: 15077971441
            tactical: '1'
    defaults:
      run:
        shell: bash
    env:
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/focused-${{ matrix.atlas }}
      BOW_TACTICAL: ${{ matrix.tactical }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45731469010
          artifact-ids: ${{ matrix.artifact }}
          path: /tmp/bow-frozen-atlas
      - name: Restore frozen atlas and terrain bytes, no production
        run: |
          mkdir -p "$BOW_ART_OUTPUT"
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          root=Path('/tmp/bow-frozen-atlas');out=Path(os.environ['BOW_ART_OUTPUT'])
          a=list(root.rglob('mixed-atlas.json'));assert len(a)==1,a
          parent=a[0].parent;meta=json.loads(a[0].read_text())
          names=['mixed-atlas.json','grass.png','sparse.png','road.png','stone.png']+[f'{k}.{ext}' for k in ['tree1','tree2','tree3','bush'] for ext in ['png','json']]+['page-'+str(k)+'.png' for k in meta['pages']]
          for name in names:
              p=parent/name;assert p.is_file(),name;shutil.copyfile(p,out/name)
          PY
      - name: Reproduce WebKit zoom on the original path and compare tactical views
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund --no-package-lock @playwright/test@1.64.0
          node --check apps/banners-of-war/research/battlefield-identity/workshop/browser-workshop.mjs
          node apps/banners-of-war/research/battlefield-identity/workshop/browser-workshop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-${{ matrix.atlas }}-zoom
          path: |
            quality-artifacts/focused-${{ matrix.atlas }}/focused-*.json
            quality-artifacts/focused-${{ matrix.atlas }}/tactical-*.png
            quality-artifacts/focused-${{ matrix.atlas }}/tactical-*.json
            quality-artifacts/focused-${{ matrix.atlas }}/difference-*.png
          if-no-files-found: error
          retention-days: 14
