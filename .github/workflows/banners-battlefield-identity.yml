name: Banners of War Battlefield Identity
on:
  pull_request:
    paths:
      - 'apps/banners-of-war/research/battlefield-identity/**'
      - '.github/workflows/banners-battlefield-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: banners-battlefield-playable-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      BOW_ART_OUTPUT: ${{ github.workspace }}/quality-artifacts/banners-battlefield-identity
      BLENDER_VERSION: '5.2.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate full physical campaign
        run: |
          node apps/banners-of-war/research/battlefield-identity/physical.test.mjs
          node apps/banners-of-war/research/battlefield-identity/composition.test.mjs
          node apps/banners-of-war/research/battlefield-identity/living.test.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45672121448
          artifact-ids: 15050357382
          path: /tmp/bow-source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45693373840
          artifact-ids: 15059369113
          path: /tmp/bow-art-baseline
      - name: Restore accepted assets
        run: |
          mkdir -p "$BOW_ART_OUTPUT"
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path('/tmp/bow-art-baseline');out=Path(os.environ['BOW_ART_OUTPUT'])
          names=['formation-atlas.json','grass.png','sparse.png','road.png','stone.png','terrain-provenance.json']+[f'{k}.{s}' for k in ['tree1','tree2','tree3','bush'] for s in ['png','json']]
          for n in names:
              f=list(root.rglob(n));assert len(f)==1,n;shutil.copyfile(f[0],out/n)
          for p in root.rglob('page-*.png'):shutil.copyfile(p,out/p.name)
          PY
      - name: Install review sheet dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil fonts-dejavu-core ffmpeg
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45703735209
          artifact-ids: 15064533786
          path: /tmp/bow-original-production
      - name: Verify and restore every original troop render
        run: |
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          from PIL import Image
          root=Path('/tmp/bow-original-production');out=Path(os.environ['BOW_ART_OUTPUT'])
          for k in ['sword','archer','knight','lightHorse']:
              matches=list(root.rglob(k+'/frames.json'))
              assert len(matches)==1,(k,matches)
              folder=matches[0].parent
              entries=json.loads(matches[0].read_text())['frames']
              expected={f'{s}-{h}-{f}' for s in range(2) for h in range(8) for f in [1,5,9,13,17,21,25,29,33,37]}
              assert expected.issubset(entries),(k,expected-set(entries))
              for name in entries:
                  with Image.open(folder/(name+'.png')) as im:
                      im.verify()
              shutil.copytree(folder,out/k,dirs_exist_ok=True)
              print(k,len(entries),'original renders verified')
          for n in ['horse-forge-index.json','horse-provenance.json','same-scale-miniatures.png','same-scale-motion.png','miniature-review-metrics.json']:
              matches=list(root.rglob(n));assert len(matches)==1,n
              shutil.copyfile(matches[0],out/n)
          PY
      - name: Pack mixed atlas and harmonize bush foliage
        run: |
          python3 apps/banners-of-war/research/battlefield-identity/pack.py
          python3 apps/banners-of-war/research/battlefield-identity/review-sheet.py
          python3 - <<'PY'
          from PIL import Image
          import os
          from pathlib import Path
          p=Path(os.environ['BOW_ART_OUTPUT'])/'bush.png'
          im=Image.open(p).convert('RGBA')
          pixels=[]
          for r,g,b,a in im.getdata():
              if a and r>g*1.13 and r>b*1.15:
                  lum=.35*r+.5*g+.15*b
                  r,g,b=int(lum*.83),int(lum*1.10),int(lum*.67)
              pixels.append((r,g,b,a))
          im.putdata(pixels);im.save(p)
          PY
      - name: Play real campaign and compare mixed rendering
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund --no-package-lock @playwright/test@1.64.0
          node apps/banners-of-war/research/battlefield-identity/capture.mjs
      - name: Retain independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banners-battlefield-identity
          path: quality-artifacts/banners-battlefield-identity
          if-no-files-found: error
          retention-days: 14
