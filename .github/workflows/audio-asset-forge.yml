name: Audio Asset Forge

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Optional app slug to build (leave empty for platform smoke test)"
        required: false
        type: string
  push:
    paths:
      - ".github/workflows/audio-asset-forge.yml"
      - "tools/audio-forge/**"
      - "shared/capabilities/sound-family.js"
      - "shared/capabilities/spatial-audio.js"
      - "shared/capabilities/continuous-audio.js"
      - "shared/capabilities/virtual-audio.js"
      - "shared/capabilities/score-director.js"
      - "shared/capabilities/music-ducking.js"
      - "shared/capabilities/score-pack.js"
      - "docs/AUDIO-FORGE.md"
      - "apps/*/audio-forge/**"
  pull_request:
    paths:
      - ".github/workflows/audio-asset-forge.yml"
      - "tools/audio-forge/**"
      - "shared/capabilities/sound-family.js"
      - "shared/capabilities/spatial-audio.js"
      - "shared/capabilities/continuous-audio.js"
      - "shared/capabilities/virtual-audio.js"
      - "shared/capabilities/score-director.js"
      - "shared/capabilities/music-ducking.js"
      - "shared/capabilities/score-pack.js"
      - "docs/AUDIO-FORGE.md"
      - "apps/*/audio-forge/**"

concurrency:
  group: audio-asset-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.app == '') ||
      (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CPU audio toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sox \
            libsox-fmt-all \
            fluidsynth \
            fluid-soundfont-gm
          npm install \
            --prefix "$RUNNER_TEMP/audio-forge-node" \
            --no-save \
            --no-package-lock \
            jsfxr@1.4.1
          echo "AUDIO_FORGE_NODE_MODULES=$RUNNER_TEMP/audio-forge-node/node_modules" >> "$GITHUB_ENV"
          soundfont="$(find /usr/share/sounds -type f \( -name '*.sf2' -o -name '*.sf3' \) | sort | head -n 1)"
          test -n "$soundfont"
          echo "AUDIO_FORGE_SOUNDFONT=$soundfont" >> "$GITHUB_ENV"

      - name: Generate SFX, ambience and music smoke assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audio-forge-smoke
          mkdir -p .audio-forge-smoke
          node tools/audio-forge/run_manifest.mjs \
            --manifest tools/audio-forge/smoke-manifest.json \
            --base .audio-forge-smoke

      - name: Validate generated audio
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            test -s "$file"
            soxi "$file"
            count=$((count + 1))
          done < .audio-forge-generated.txt
          test "$count" -eq 3

      - name: Test Sound Forge foundation
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/audio-forge/foundation.test.mjs tools/audio-forge/sound-family.test.mjs tools/audio-forge/expression.test.mjs tools/audio-forge/spatial-audio.test.mjs tools/audio-forge/continuous-audio.test.mjs tools/audio-forge/virtual-audio.test.mjs tools/audio-forge/score-director.test.mjs tools/audio-forge/music-ducking.test.mjs tools/audio-forge/score-pack.test.mjs tools/audio-forge/banners-adapter.test.mjs tools/audio-forge/plucked-instruments.test.mjs tools/audio-forge/wind-instruments.test.mjs tools/audio-forge/bowed-instruments.test.mjs tools/audio-forge/orchestral-instruments.test.mjs tools/audio-forge/ensemble-room.test.mjs tools/audio-forge/recorded-instruments.test.mjs tools/audio-forge/recorded-sustain.test.mjs tools/audio-forge/recorded-articulations.test.mjs tools/audio-forge/recorded-legato.test.mjs tools/audio-forge/recorded-dynamics.test.mjs tools/audio-forge/recorded-performance.test.mjs tools/audio-forge/recorded-transients.test.mjs tools/audio-forge/recorded-ensemble.test.mjs tools/audio-forge/merge-recorded-libraries.test.mjs
          rm -rf .audio-forge-foundation
          mkdir -p .audio-forge-foundation
          node tools/audio-forge/run_manifest.mjs --manifest tools/audio-forge/foundation-smoke.json --base .audio-forge-foundation
          count=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            soxi "$file"
            count=$((count + 1))
          done < .audio-forge-generated.txt
          test "$count" -eq 23

      - name: Test sample library and hybrid engine
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/audio-forge/sample-library.test.mjs tools/audio-forge/persistent-library.test.mjs
          rm -rf .audio-forge-hybrid
          node tools/audio-forge/hybrid-smoke.mjs .audio-forge-hybrid
          node tools/audio-forge/run_manifest.mjs --manifest .audio-forge-hybrid/manifest.json --base .audio-forge-hybrid
          count=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            soxi "$file"
            count=$((count + 1))
          done < .audio-forge-generated.txt
          test "$count" -eq 5

      - name: Upload hybrid audio
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-hybrid-${{ github.run_id }}
          path: |
            .audio-forge-hybrid/generated/
            .audio-forge-hybrid/manifest.json
            .audio-forge-hybrid/fixture.wav
          if-no-files-found: error
          retention-days: 7

      - name: Render continuous audio audition
        run: node tools/audio-forge/runtime-audition.mjs .audio-runtime-audition

      - name: Upload continuous audio audition
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-continuous-${{ github.run_id }}
          path: .audio-runtime-audition/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload foundation audio
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-foundation-${{ github.run_id }}
          path: .audio-forge-foundation/generated/
          if-no-files-found: error
          retention-days: 7

      - name: Upload smoke audio
        uses: actions/upload-artifact@v4
        with:
          name: audio-asset-forge-smoke-${{ github.run_id }}
          path: .audio-forge-smoke/generated/
          if-no-files-found: error
          retention-days: 7

      - name: Render musical identity states
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/score-states.mjs .audio-score-states
          node tools/audio-forge/run_manifest.mjs --manifest .audio-score-states/manifest.json --base .audio-score-states
          node tools/audio-forge/finalize-score.mjs .audio-score-states
          test "$(find .audio-score-states/states -name '*.wav' | wc -l)" -eq 4
          test -s .audio-score-states/state-journey.wav
          test -s .audio-score-states/bridge-journey.wav
          test -s .audio-score-states/adaptive-journey.wav
          test "$(find .audio-score-states/adaptive -name '*.wav' | wc -l)" -eq 8
          test "$(find .audio-score-states/bridges -name '*.wav' | wc -l)" -eq 4
          test "$(find .audio-score-states/stingers -name '*.wav' | wc -l)" -eq 3

      - name: Upload musical identity auditions
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-score-states-${{ github.run_id }}
          path: |
            .audio-score-states/states/
            .audio-score-states/state-journey.wav
            .audio-score-states/bridges/
            .audio-score-states/stingers/
            .audio-score-states/bridge-journey.wav
            .audio-score-states/adaptive/
            .audio-score-states/adaptive-journey.wav
            .audio-score-states/score-graph.json
            .audio-score-states/score-metrics.json
            .audio-score-states/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Render expressive instrument and material auditions
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/artistic-lab.mjs .audio-artistic-lab
          node tools/audio-forge/run_manifest.mjs --manifest .audio-artistic-lab/manifest.json --base .audio-artistic-lab
          node tools/audio-forge/artistic-catalog.mjs .audio-artistic-lab
          test "$(find .audio-artistic-lab/generated/music -name '*.wav' | wc -l)" -eq 6
          test "$(find .audio-artistic-lab/generated/effects -name '*.wav' | wc -l)" -eq 24

      - name: Upload artistic auditions and research library
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-artistic-lab-${{ github.run_id }}
          path: .audio-artistic-lab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Render original plucked instrument laboratory
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/string-lab.mjs .audio-string-lab
          node tools/audio-forge/run_manifest.mjs --manifest .audio-string-lab/manifest.json --base .audio-string-lab
          node tools/audio-forge/finalize-string-lab.mjs .audio-string-lab
          test "$(find .audio-string-lab/notes -name '*.wav' | wc -l)" -eq 18
          test -s .audio-string-lab/river-crossing-AB.wav

      - name: Upload original string instrument auditions
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-string-lab-${{ github.run_id }}
          path: .audio-string-lab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Render continuous wind instrument laboratory
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/wind-lab.mjs .audio-wind-lab
          test "$(find .audio-wind-lab/notes -name '*.wav' | wc -l)" -eq 12
          test -s .audio-wind-lab/flute-AB.wav
          test -s .audio-wind-lab/reed-AB.wav
          test -s .audio-wind-lab/hill-path.wav

      - name: Upload continuous wind instrument auditions
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-wind-lab-${{ github.run_id }}
          path: .audio-wind-lab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Render bowed instrument laboratory
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/bowed-lab.mjs .audio-bowed-lab
          test "$(find .audio-bowed-lab/notes -name '*.wav' | wc -l)" -eq 12
          test -s .audio-bowed-lab/violin-AB.wav
          test -s .audio-bowed-lab/cello-AB.wav
          test -s .audio-bowed-lab/winter-banner.wav

      - name: Upload bowed instrument auditions
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-bowed-lab-${{ github.run_id }}
          path: .audio-bowed-lab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Render brass percussion and ensemble laboratory
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/orchestra-lab.mjs .audio-orchestra-lab
          test "$(find .audio-orchestra-lab/notes -name '*.wav' | wc -l)" -eq 28
          test "$(find .audio-orchestra-lab/stems -name '*.wav' | wc -l)" -eq 5
          test -s .audio-orchestra-lab/horn-AB.wav
          test -s .audio-orchestra-lab/trumpet-AB.wav
          test -s .audio-orchestra-lab/march-of-the-vale.wav

      - name: Upload orchestral laboratory auditions
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-orchestra-lab-${{ github.run_id }}
          path: .audio-orchestra-lab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Render matched expressive ensemble and room auditions
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/orchestra-lab.mjs .audio-orchestra-expressive --expressive-ensemble
          node tools/audio-forge/ensemble-room-lab.mjs .audio-ensemble-room .audio-orchestra-lab .audio-orchestra-expressive
          test "$(find .audio-ensemble-room -maxdepth 1 -name '*.wav' | wc -l)" -eq 9
          test "$(find .audio-orchestra-expressive/stems -name '*.wav' | wc -l)" -eq 5

      - name: Upload matched ensemble acoustics auditions
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-ensemble-room-${{ github.run_id }}
          path: .audio-ensemble-room/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  recorded-timbre-audition:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.app == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audio decoder
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends sox libsox-fmt-all
      - name: Import pinned original recordings and render matched timbre studies
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/recorded-timbre-lab.mjs .audio-recorded-timbre
          test "$(find .audio-recorded-timbre/sources -type f | wc -l)" -eq 11
          test "$(find .audio-recorded-timbre/auditions -name '*.wav' | wc -l)" -eq 10
          test -s .audio-recorded-timbre/auditions/river-meadow.wav
      - uses: actions/upload-artifact@v4
        with:
          name: sound-forge-recorded-timbre-${{ github.run_id }}
          path: .audio-recorded-timbre/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Measure and render extended recorded sustains
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/recorded-sustain-lab.mjs .audio-recorded-timbre .audio-recorded-sustain
          test "$(find .audio-recorded-sustain -name '*.wav' | wc -l)" -eq 14
          test -s .audio-recorded-sustain/flute-sustain-AB.wav
          test -s .audio-recorded-sustain/violin-sustain-AB.wav
      - uses: actions/upload-artifact@v4
        with:
          name: sound-forge-recorded-sustain-${{ github.run_id }}
          path: .audio-recorded-sustain/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Import recorded dynamic layers and articulation takes
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/recorded-articulation-lab.mjs .audio-recorded-articulations .audio-recorded-timbre
          test "$(find .audio-recorded-articulations/sources -name '*.wav' | wc -l)" -eq 7
          test "$(find .audio-recorded-articulations -maxdepth 1 -name '*.wav' | wc -l)" -eq 10
          test -s .audio-recorded-articulations/violin-dynamics-AB.wav
          test -s .audio-recorded-articulations/flute-round-robin-AB.wav
          test -s .audio-recorded-articulations/flute-articulation-AB.wav
      - uses: actions/upload-artifact@v4
        with:
          name: sound-forge-recorded-articulations-${{ github.run_id }}
          path: .audio-recorded-articulations/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Import expanded recorded bank and render connected phrases
        id: recorded_legato
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/recorded-legato-lab.mjs .audio-recorded-legato .audio-recorded-articulations
          test "$(find .audio-recorded-legato/sources -name '*.wav' | wc -l)" -eq 12
          test "$(find .audio-recorded-legato -maxdepth 1 -name '*.wav' | wc -l)" -eq 13
          test -s .audio-recorded-legato/recorded-quartet-study.wav
      - uses: actions/upload-artifact@v4
        with:
          name: sound-forge-recorded-legato-${{ github.run_id }}
          path: .audio-recorded-legato/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Import brass layers and render continuous recorded dynamics
        id: recorded_dynamics
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/recorded-dynamics-lab.mjs .audio-recorded-dynamics .audio-recorded-legato
          test "$(find .audio-recorded-dynamics/sources -name '*.wav' | wc -l)" -eq 12
          test "$(find .audio-recorded-dynamics -maxdepth 1 -name '*.wav' | wc -l)" -eq 19
          test -s .audio-recorded-dynamics/dawn-procession-AB.wav
          test -s .audio-recorded-dynamics/dawn-procession-chamber.wav
      - uses: actions/upload-artifact@v4
        with:
          name: sound-forge-recorded-dynamics-${{ github.run_id }}
          path: .audio-recorded-dynamics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Preserve recorded dynamics pitch rejection evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-dynamics-rejection-${{ github.run_id }}
          path: |
            .audio-recorded-dynamics/pitch-rejection.json
            .audio-recorded-dynamics/sources/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Render unified six-instrument recorded ensemble
        id: recorded_ensemble
        if: ${{ !cancelled() && steps.recorded_dynamics.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/recorded-ensemble-lab.mjs .audio-recorded-ensemble .audio-recorded-dynamics
          test "$(find .audio-recorded-ensemble -maxdepth 1 -name '*.wav' | wc -l)" -eq 6
          test -s .audio-recorded-ensemble/evening-standard-AB.wav
          test "$(find .audio-recorded-ensemble/expanded -maxdepth 1 -name '*.wav' | wc -l)" -eq 11
          test -s .audio-recorded-ensemble/expanded/evening-standard-room-ABC.wav
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.recorded_ensemble.outcome == 'success' }}
        with:
          name: sound-forge-recorded-ensemble-${{ github.run_id }}
          path: .audio-recorded-ensemble/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Import and render unified recorded performance
        id: recorded_performance
        if: ${{ !cancelled() && steps.recorded_legato.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/recorded-performance-lab.mjs .audio-recorded-performance .audio-recorded-legato
          test "$(find .audio-recorded-performance/sources -name '*.wav' | wc -l)" -eq 8
          test "$(find .audio-recorded-performance -maxdepth 1 -name '*.wav' | wc -l)" -eq 8
          test -s .audio-recorded-performance/violin-articulation-suite.wav
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.recorded_performance.outcome == 'success' }}
        with:
          name: sound-forge-recorded-performance-${{ github.run_id }}
          path: .audio-recorded-performance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Preserve unified articulation rejection evidence
        if: ${{ !cancelled() && steps.recorded_performance.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: sound-forge-performance-rejection-${{ github.run_id }}
          path: |
            .audio-recorded-performance/articulation-admission.json
            .audio-recorded-performance/candidates/
            .audio-recorded-performance/sources/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Merge verified recorded instrument libraries
        id: recorded_library_merge
        if: ${{ !cancelled() && steps.recorded_dynamics.outcome == 'success' && steps.recorded_performance.outcome == 'success' && steps.recorded_ensemble.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/merge-recorded-libraries.mjs .audio-recorded-unified-library performance=.audio-recorded-performance/library articulations=.audio-recorded-articulations/library dynamics=.audio-recorded-dynamics/library
          test "$(node -e "const x=require('./.audio-recorded-unified-library/index.json');process.stdout.write(String(x.entries.length))")" -eq 47
          test -s .audio-recorded-unified-library/catalog.sqlite
          test -s .audio-recorded-unified-library/merge-report.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.recorded_library_merge.outcome == 'success' }}
        with:
          name: sound-forge-unified-recorded-library-${{ github.run_id }}
          path: .audio-recorded-unified-library/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  field-recording-audition:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.app == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sox libsox-fmt-all
      - name: Import pinned recordings and render auditions
        shell: bash
        run: |
          set -euo pipefail
          node tools/audio-forge/field-recordings.mjs .audio-forge-field
          node tools/audio-forge/run_manifest.mjs --manifest .audio-forge-field/manifest.json --base .audio-forge-field
          count=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            soxi "$file"
            count=$((count + 1))
          done < .audio-forge-generated.txt
          test "$count" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: sound-forge-field-recordings-${{ github.run_id }}
          path: |
            .audio-forge-field/generated/
            .audio-forge-field/objects/
            .audio-forge-field/manifest.json
            .audio-forge-field/catalog.sqlite
          if-no-files-found: error
          retention-days: 7

  audio-runtime-browser:
    needs: platform-smoke
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.app == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/audio-browser" --no-save --no-package-lock playwright@1.55.0
          browser_cli="$RUNNER_TEMP/audio-browser/node_modules/.bin/playwright"
          # Refresh stale runner package indexes; retry dependency install once.
          sudo apt-get update -o Acquire::Retries=3
          if ! "$browser_cli" install-deps ${{ matrix.browser }}; then
            sudo apt-get update -o Acquire::Retries=3
            "$browser_cli" install-deps ${{ matrix.browser }}
          fi
          "$browser_cli" install ${{ matrix.browser }}
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/audio-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Checkout pinned Banners audio contract for research-only test
        uses: actions/checkout@v4
        with:
          ref: 5cf0a72622621ac0dc0d5e1a88cbd9a0369e2616
          path: .audio-banners-contract
          sparse-checkout: apps/banners-of-war/research/battlefield-identity/battle-audio.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Run real Web Audio checks
        env:
          BANNERS_AUDIO_CONTRACT: .audio-banners-contract/apps/banners-of-war/research/battlefield-identity/battle-audio.js
        run: node tools/audio-forge/browser-runtime.mjs ${{ matrix.browser }} .audio-runtime-browser
      - name: Download same-run authored score
        uses: actions/download-artifact@v4
        with:
          name: sound-forge-score-states-${{ github.run_id }}
          path: .audio-authored-score
      - name: Verify authored score in real Web Audio
        run: node tools/audio-forge/browser-authored-score.mjs ${{ matrix.browser }} .audio-authored-score .audio-runtime-browser
      - uses: actions/upload-artifact@v4
        with:
          name: sound-forge-runtime-${{ matrix.browser }}-${{ github.run_id }}
          path: .audio-runtime-browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  generate-app-assets:
    if: >-
      (github.event_name == 'push' && github.ref_name != 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.app != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Refuse direct generation on main
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "Audio Forge writes generated assets back to the current feature branch; select a non-main branch."
            exit 1
          fi

      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CPU audio toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sox \
            libsox-fmt-all \
            fluidsynth \
            fluid-soundfont-gm
          npm install \
            --prefix "$RUNNER_TEMP/audio-forge-node" \
            --no-save \
            --no-package-lock \
            jsfxr@1.4.1
          echo "AUDIO_FORGE_NODE_MODULES=$RUNNER_TEMP/audio-forge-node/node_modules" >> "$GITHUB_ENV"
          soundfont="$(find /usr/share/sounds -type f \( -name '*.sf2' -o -name '*.sf3' \) | sort | head -n 1)"
          test -n "$soundfont"
          echo "AUDIO_FORGE_SOUNDFONT=$soundfont" >> "$GITHUB_ENV"

      - name: Build app-local audio manifests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node tools/audio-forge/run_manifest.mjs --app "${{ inputs.app }}"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              before="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -z "$before" ]]; then
              echo "Cannot determine a previous commit for changed-app discovery. Use workflow_dispatch with an app slug."
              exit 1
            fi
            node tools/audio-forge/run_manifest.mjs --changed-from "$before"
          fi

      - name: Validate generated audio
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .audio-forge-generated.txt ]]; then
            echo "No generated audio outputs were reported."
            exit 0
          fi
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            test -s "$file"
            soxi "$file"
          done < .audio-forge-generated.txt

      - name: Commit generated audio back to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .audio-forge-generated.txt ]]; then
            echo "No generated outputs were reported."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r file; do
            [[ -n "$file" ]] && git add -- "$file"
          done < .audio-forge-generated.txt

          if git diff --cached --quiet; then
            echo "Generated audio assets are already up to date."
            exit 0
          fi

          git commit -m "Generate audio assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
