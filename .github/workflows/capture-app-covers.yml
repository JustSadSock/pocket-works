name: Capture Application Covers

# Covers are real browser screenshots stored separately from apps. A failed capture
# leaves the app's authored icon intact; it never substitutes generated AI scenery.
# Daily/manual only: per-app pushes were generating extra main commits and deployments.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated slugs to refresh (empty = changed and missing covers)'
        required: false
        default: ''
      limit:
        description: 'Maximum screenshots per run (1–24)'
        required: false
        default: '12'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: pocket-works-cover-capture
  cancel-in-progress: false

jobs:
  real-app-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # Per-game Git revisions must be available, not just HEAD.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build and screenshot dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify committed PocketNet snapshots before screenshot build
        # Never silently repair release artifacts inside a screenshot workflow.
        run: node scripts/build-pocketnet-modules.mjs --check
      - name: Assemble production-like site
        run: npm run build:quality-site
      - name: Check screenshot lifecycle tests and syntax
        run: |
          node --check scripts/capture-covers.mjs
          node --check scripts/cover-intelligence.mjs
          node --check scripts/cover-gameplay-entry.mjs
          node --test scripts/cover-intelligence.test.mjs scripts/cover-gameplay-entry.test.mjs
      - name: Refresh all existing game covers in batches
        env:
          PW_COVER_SLUGS: ${{ github.event.inputs.slugs || '' }}
          PW_COVER_LIMIT: "24"
          PW_COVER_DIAGNOSTICS: "1"
          # Backfill request: every app last photographed before this date.
          # The manifest records new attempts, preventing infinite retries.
          PW_COVER_REFRESH_BEFORE: "2026-10-13T12:30:00Z"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PW_COVER_VISION_MODEL: ${{ vars.PW_COVER_VISION_MODEL || 'gpt-4.1-mini' }}
        run: |
          for batch in $(seq 1 12); do
            echo "Capturing cover batch $batch"
            node scripts/capture-covers.mjs | tee /tmp/pocket-cover-batch.json
            remaining=$(node -e "const fs=require('fs'); const result=JSON.parse(fs.readFileSync('/tmp/pocket-cover-batch.json','utf8')); process.stdout.write(String(result.remaining));")
            echo "Remaining covers to attempt: $remaining"
            if [ "$remaining" -eq 0 ]; then break; fi
            sleep 1
          done
      - name: Upload rejected-frame diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-failure-diagnostics
          path: cover-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only verified screenshot files
        run: |
          git add -A -- covers/ || true
          if git diff --cached --quiet; then
            echo "No new screens; all captures either exist or did not meet the image gate."
            exit 0
          fi
          git config user.name 'pocket-works-cover-bot'
          git config user.email 'pocket-works-cover-bot@users.noreply.github.com'
          git commit -m 'chore(covers): refresh genuine app screenshots'
          # Keep the single daily/manual cover commit; never create snapshots.
          # Pocket Works changes frequently while the batch runs: integrate
          # newer main commits without ever force-pushing unrelated code.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done
          echo "Could not push captured covers after five attempts" >&2
          exit 1
