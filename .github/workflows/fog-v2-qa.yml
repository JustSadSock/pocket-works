name: Fog original v2 QA
on:
  push:
    branches: [app/fog-of-conquest-port-20261018]
    paths: [.github/workflows/fog-v2-qa.yml]
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Verify source rules and client syntax
        run: |
          node --version
          node --check apps/fog-of-conquest/js/ui.js
          node --check apps/fog-of-conquest/pocket-online.js
          node --check apps/fog-of-conquest/pocket-adapter.js
          node --test apps/fog-of-conquest/test/original-port.test.mjs apps/fog-of-conquest/test/original-pocketnet.test.mjs
          npm run registry:check
      - name: Remove temporary QA runner
        if: always()
        run: |
          git rm -f .github/workflows/fog-v2-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove one-shot Fog verification'
          git push origin HEAD:app/fog-of-conquest-port-20261018
