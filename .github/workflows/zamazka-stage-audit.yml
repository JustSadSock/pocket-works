name: ZAMAZKA visual stage audit
on:
  pull_request:
    paths:
      - 'apps/zamazka/visual-critique-147.css'
      - 'apps/zamazka/finale-ui.js'
      - 'apps/zamazka/app.js'
      - 'apps/zamazka/qa/visual-stage-regression.mjs'
      - 'apps/zamazka/qa/fill-matching-colour.mjs'
      - 'apps/zamazka/fill-core.js'
      - 'apps/zamazka/museum-audio.js'
      - '.github/workflows/zamazka-stage-audit.yml'
  push:
    branches: [main]
    paths:
      - 'apps/zamazka/visual-critique-147.css'
      - 'apps/zamazka/finale-ui.js'
      - 'apps/zamazka/app.js'
      - 'apps/zamazka/qa/visual-stage-regression.mjs'
      - 'apps/zamazka/fill-core.js'
permissions:
  contents: read
jobs:
  geometry-and-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production RGB and contour regressions
        run: |
          node apps/zamazka/qa/fill-matching-colour.mjs
          node apps/zamazka/qa/fill-integrity.mjs
          node --check apps/zamazka/finale-ui.js
          node --check apps/zamazka/app.js
          node --check apps/zamazka/museum-audio.js
      - name: Install isolated Chromium without root workspace dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/zamazka-playwright" node_modules/@playwright
          printf '{"name":"zamazka-visual-audit","version":"1.0.0","private":true}' > "$RUNNER_TEMP/zamazka-playwright/package.json"
          npm install --prefix "$RUNNER_TEMP/zamazka-playwright" --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          ln -s "$RUNNER_TEMP/zamazka-playwright/node_modules/@playwright/test" node_modules/@playwright/test
          "$RUNNER_TEMP/zamazka-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify geometry on real phase markup
        run: node apps/zamazka/qa/visual-stage-regression.mjs
