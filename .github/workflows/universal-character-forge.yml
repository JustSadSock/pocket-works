name: Universal Character Forge Research
on:
  pull_request:
    paths:
      - 'tools/character-forge/**'
      - 'docs/UNIVERSAL-CHARACTER-FORGE.md'
      - '.github/workflows/universal-character-forge.yml'
  workflow_dispatch:
    inputs:
      full_production:
        description: 'Run the historical full art suite only after the local component review'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: character-forge-v11-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHARACTER_EVIDENCE: ${{ github.workspace }}/quality-artifacts/character-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify geometry, skinning, determinism, composition and budgets
        run: node --test tools/character-forge/core.test.mjs tools/character-forge/v2.test.mjs tools/character-forge/v3.test.mjs tools/character-forge/v4.test.mjs tools/character-forge/v7.test.mjs
      - name: Produce focused morphology, animal and sprite candidates
        run: CHARACTER_V7_FOCUS=1 node tools/character-forge/native-v4.mjs
      - name: Compare actual pinned CMU motion
        run: |
          python3 tools/character-forge/fetch-control-motion.py
          node tools/character-forge/capture-v4.mjs
      - name: Convert original previews to PNG and video
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin python3-pil ffmpeg fonts-dejavu-core
          python3 tools/character-forge/evidence-v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-core
          path: quality-artifacts/character-forge
          retention-days: 14
  browser:
    needs: core
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-core
          path: quality-artifacts/character-forge
      - name: Install isolated comparison tools without modifying lockfile
        run: npm install --no-save --legacy-peer-deps --no-package-lock --no-audit --no-fund playwright@1.64.0 three@0.180.0
      - name: Actual native GLB and Canvas group probes
        run: node tools/character-forge/sprite-browser.mjs quality-artifacts/character-forge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-browser
          path: |
            quality-artifacts/character-forge/sprite-browser.json
            quality-artifacts/character-forge/sprite-5000-*.png
          retention-days: 14
  morph-source:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CHARACTER_EVIDENCE: ${{ github.workspace }}/quality-artifacts/character-morph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-core
          path: quality-artifacts/character-morph/control
      - name: Preserve measured CMU 35_01 source trajectory
        run: cp quality-artifacts/character-morph/control/capture-v4-report.json "$CHARACTER_EVIDENCE/capture-v4-report.json"
      - name: Import MakeHuman source skin, morphs and original weights
        run: |
          python3 tools/character-forge/makehuman-adapter.py
          node tools/character-forge/makehuman-export.mjs
          CHARACTER_EVIDENCE_SOURCE="$CHARACTER_EVIDENCE" node --test tools/character-forge/v4.test.mjs
          CHARACTER_V11_FOCUS=1 node tools/character-forge/recovery-v6.mjs
          CHARACTER_V7_SOURCE="$CHARACTER_EVIDENCE" node --test tools/character-forge/v7.test.mjs
          CHARACTER_EVIDENCE_SOURCE="$CHARACTER_EVIDENCE" node --test tools/character-forge/v9.test.mjs
      - name: Required exact skeletal cloth driver
        run: node tools/character-forge/research-v11-input.mjs
      - name: Required source-local hand/Core matrix input (qualification enforced in Bridge)
        continue-on-error: true
        run: node tools/character-forge/hand-reference-v15.mjs
      - name: Retrieve licensed KinemIQ archive with exact digest
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 -o "$CHARACTER_EVIDENCE/v9-cc0-motions.zip" https://huggingface.co/datasets/Kinemiq/free-game-animations/resolve/main/KinemIQ_Free_Animations_CC0_GLB.zip
          echo '64ca5ab4a92c9da079c5e88ca509391b0a58a24ccf2a1307b16e2f0fc6b23ffc  '"$CHARACTER_EVIDENCE/v9-cc0-motions.zip" | sha256sum --check --strict
      - name: Render matched static surface candidates and actual-size comparisons (explicit full suite only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_production }}
        run: |
          node tools/character-forge/recovery-v6.mjs
          node tools/character-forge/research-v7.mjs
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin python3-pil ffmpeg
          python3 tools/character-forge/evidence-v6.py
          python3 tools/character-forge/fabric-v8.py
          node tools/character-forge/research-v8.mjs
          python3 tools/character-forge/evidence-v8.py
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 -o "$CHARACTER_EVIDENCE/v9-cc0-motions.zip" https://huggingface.co/datasets/Kinemiq/free-game-animations/resolve/main/KinemIQ_Free_Animations_CC0_GLB.zip
          echo '64ca5ab4a92c9da079c5e88ca509391b0a58a24ccf2a1307b16e2f0fc6b23ffc  '"$CHARACTER_EVIDENCE/v9-cc0-motions.zip" | sha256sum --check --strict
          node tools/character-forge/research-v9.mjs
          CHARACTER_EVIDENCE="$CHARACTER_EVIDENCE" node --test tools/character-forge/v9-evidence.test.mjs
          python3 tools/character-forge/evidence-v9.py
          node tools/character-forge/qualification-v10.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-morph-v9
          path: quality-artifacts/character-morph
          retention-days: 14
  art-forge-bridge:
    needs: [core, morph-source]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CHARACTER_EVIDENCE: ${{ github.workspace }}/quality-artifacts/character-bridge
      BLENDER_VERSION: '5.2.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-core
          path: quality-artifacts/character-bridge
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-morph-v9
          path: quality-artifacts/character-bridge/morph
      - name: Install verified editor
        run: |
          rm -f /etc/apt/sources.list.d/microsoft-prod.list
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils libgl1 libx11-6 libxi6 libxrender1 ffmpeg librsvg2-bin
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Re-import original composite creature through Universal Art Forge v2
        run: |
          status=0
          python3 tools/character-forge/forge-bridge.py || status=1
          CHARACTER_BRIDGE_INPUT="$CHARACTER_EVIDENCE/morph/makehuman-base.glb" CHARACTER_BRIDGE_LABEL=makehuman python3 tools/character-forge/forge-bridge.py || status=1
          for role in artisan merchant; do
            CHARACTER_BRIDGE_INPUT="$CHARACTER_EVIDENCE/morph/v9-$role.glb" CHARACTER_BRIDGE_LABEL=v9-$role python3 tools/character-forge/forge-bridge.py || status=1
          done
          exit "$status"
      - name: Full suite strict military and v8 round-trip (explicit only)
        if: ${{ !cancelled() && env.BLENDER != '' && github.event_name == 'workflow_dispatch' && inputs.full_production }}
        run: |
          status=0
          CHARACTER_BRIDGE_INPUT="$CHARACTER_EVIDENCE/morph/v8-artisan.glb" CHARACTER_BRIDGE_LABEL=v8-artisan python3 tools/character-forge/forge-bridge.py || status=1
          for role in infantry legionary; do
            CHARACTER_BRIDGE_INPUT="$CHARACTER_EVIDENCE/morph/v9-$role.glb" CHARACTER_BRIDGE_LABEL=v9-$role python3 tools/character-forge/forge-bridge.py || status=1
          done
          exit "$status"
      - name: Compare one matched transparent frame through existing Art Forge bake
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: python3 tools/character-forge/sprite-bake.py
      - name: Surface Art Forge bake (explicit full suite only)
        if: ${{ !cancelled() && env.BLENDER != '' && github.event_name == 'workflow_dispatch' && inputs.full_production }}
        run: CHARACTER_SURFACE_BAKE=1 python3 tools/character-forge/sprite-bake.py
      - name: Legacy garment diagnostics (explicit full suite only)
        if: ${{ !cancelled() && env.BLENDER != '' && github.event_name == 'workflow_dispatch' && inputs.full_production }}
        run: |
          status=0
          "$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/cloth-study.py || status=1
          "$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/cloth-settle.py || status=1
          exit "$status"
      - name: v9 garment collision audit (explicit full suite only)
        if: ${{ !cancelled() && env.BLENDER != '' && github.event_name == 'workflow_dispatch' && inputs.full_production }}
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/cloth-study-v9.py'
      - name: Independent original MakeHuman bind and evaluated skin comparison
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/hand-bind-v15.py'
      - name: Independent licensed reference hand and authored pose library
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/hand-source-v15.py'
      - name: Render evaluated external hand reference
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: node tools/character-forge/hand-reference-render-v15.mjs
      - name: Reference anatomical frame transfer on actual MakeHuman skin
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: node tools/character-forge/hand-transfer-v16.mjs
      - name: Independent source and transferred hand triangle audit
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/hand-audit-v16.py'
      - name: Local index PIP surface correctives and conforming retessellation
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: node tools/character-forge/hand-surface-v17.mjs
      - name: Independent local index geometry audit
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/hand-surface-audit-v17.py'
      - name: Required gated physical garment reference and remesh recovery
        id: recovery
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: 'CHARACTER_V15_CLOTH=1 "$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/cloth-recovery-v11.py'
      - name: Render local cloth experiment evidence even after a rejected gate
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: CHARACTER_V15_CLOTH=1 node tools/character-forge/cloth-evidence-v12.mjs
      - name: Isolated Remesh defect trajectory and one-factor physical matrix
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/cloth-coupon-v16.py'
      - name: Full cloth bake and standalone playback after recovery gate
        id: cloth
        if: ${{ !cancelled() && env.BLENDER != '' && steps.recovery.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.full_production }}
        run: |
          "$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/cloth-settle-v9.py
          node tools/character-forge/evidence-cloth-v9.mjs
          python3 tools/character-forge/evidence-cloth-v9.py
          node --test tools/character-forge/cloth-cache-v9.test.mjs
          for variant in A B C; do
            ffmpeg -hide_banner -loglevel error -y -framerate 24 -i "$CHARACTER_EVIDENCE/v10-cloth-$variant/%02d.png" -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v10-cloth-$variant.mp4"
          done
      - name: Validate offline research script syntax
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: |
          python3 -m py_compile tools/character-forge/cloth-study-v9.py tools/character-forge/cloth-settle-v9.py tools/character-forge/kinemiq-v11.py tools/character-forge/cloth-recovery-v11.py
          node --check tools/character-forge/grip-study-v11.mjs
          node --check tools/character-forge/motion-study-v10.mjs
          node --check tools/character-forge/motion-study-v12.mjs
          node --check tools/character-forge/qualification-v10.mjs
          node --check tools/character-forge/hand-reference-v15.mjs
          node --check tools/character-forge/motion-continuous-v15.mjs
          node --check tools/character-forge/hand-transfer-v16.mjs
          node --check tools/character-forge/hand-surface-v17.mjs
          python3 -m py_compile tools/character-forge/hand-surface-audit-v17.py
          python3 -m py_compile tools/character-forge/hand-audit-v16.py tools/character-forge/cloth-coupon-v16.py
          python3 -m py_compile tools/character-forge/hand-bind-v15.py tools/character-forge/hand-source-v15.py tools/character-forge/motion-independent-v15.py
      - name: Required native CC0 reference motion (skinless GLB channels)
        id: kinemiq
        if: ${{ !cancelled() }}
        run: python3 tools/character-forge/kinemiq-v11.py
      - name: Required v15 continuous contact 25/49/97 exported key states
        id: continuous
        if: ${{ !cancelled() && steps.kinemiq.outcome == 'success' }}
        run: CHARACTER_V15_MOTION=1 node tools/character-forge/motion-study-v12.mjs
      - name: Independent imported Blender walk playback
        if: ${{ !cancelled() && env.BLENDER != '' && steps.continuous.outcome == 'success' }}
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/motion-independent-v15.py'
      - name: Publish matched continuous motion and three-loop diagnostic videos
        if: ${{ !cancelled() && steps.continuous.outcome == 'success' }}
        run: |
          fps=$(python3 -c 'import json,os;print(24/json.load(open(os.environ["CHARACTER_EVIDENCE"]+"/v10-reference-trajectory.json"))["durationSeconds"])')
          for view in side front; do
            for variant in Original 25 49 97 cyclic49 cyclic97 cyclic49Upper velocity49half velocity49 elbow49; do
              ffmpeg -hide_banner -loglevel error -y -framerate "$fps" -i "$CHARACTER_EVIDENCE/v15-walk-$variant-$view/%02d.png" -frames:v 24 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v15-walk-$variant-$view-1x.mp4"
            done
            ffmpeg -hide_banner -loglevel error -y -i "$CHARACTER_EVIDENCE/v15-walk-Original-$view-1x.mp4" -i "$CHARACTER_EVIDENCE/v15-walk-25-$view-1x.mp4" -i "$CHARACTER_EVIDENCE/v15-walk-49-$view-1x.mp4" -i "$CHARACTER_EVIDENCE/v15-walk-97-$view-1x.mp4" -filter_complex hstack=inputs=4 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v15-walk-comparison-$view-1x.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$CHARACTER_EVIDENCE/v15-walk-comparison-$view-1x.mp4" -vf setpts=2*PTS -r 30 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v15-walk-comparison-$view-05x.mp4"
            ffmpeg -hide_banner -loglevel error -y -framerate "$fps" -i "$CHARACTER_EVIDENCE/v15-loop-$view/%02d.png" -frames:v 72 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v15-loop-$view.mp4"
            if [ -d "$CHARACTER_EVIDENCE/v15-anatomy-$view" ]; then
              ffmpeg -hide_banner -loglevel error -y -framerate "$fps" -i "$CHARACTER_EVIDENCE/v15-anatomy-$view/%02d.png" -frames:v 24 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v15-anatomy-$view.mp4"
            fi
            ffmpeg -hide_banner -loglevel error -y -i "$CHARACTER_EVIDENCE/v15-walk-Original-$view-1x.mp4" -i "$CHARACTER_EVIDENCE/v15-walk-49-$view-1x.mp4" -i "$CHARACTER_EVIDENCE/v15-walk-cyclic49-$view-1x.mp4" -i "$CHARACTER_EVIDENCE/v15-walk-cyclic49Upper-$view-1x.mp4" -filter_complex hstack=inputs=4 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v16-walk-cyclic-comparison-$view.mp4"
            for variant in cyclic49 velocity49 elbow49; do
              ffmpeg -hide_banner -loglevel error -y -framerate "$fps" -i "$CHARACTER_EVIDENCE/v17-loop-$variant-$view/%02d.png" -frames:v 72 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v17-loop-$variant-$view.mp4"
              if [ -d "$CHARACTER_EVIDENCE/v17-anatomy-$variant-$view" ]; then
                ffmpeg -hide_banner -loglevel error -y -framerate "$fps" -i "$CHARACTER_EVIDENCE/v17-anatomy-$variant-$view/%02d.png" -frames:v 24 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v17-anatomy-$variant-$view.mp4"
              fi
            done
          done
      - name: Enforce continuous exported contact qualification
        if: ${{ !cancelled() }}
        run: |
          node -e 'const r=require(process.env.CHARACTER_EVIDENCE+"/v15-continuous-report.json"),a=require(process.env.CHARACTER_EVIDENCE+"/v15-motion-independent.json");if(!r.qualification.contactGate||!a.agreement)throw Error("Continuous contact gate rejected: "+JSON.stringify(r.reports[r.selected].max))'
      - name: Native animal and mounted composition comparisons (explicit full suite only)
        if: ${{ !cancelled() && env.BLENDER != '' && github.event_name == 'workflow_dispatch' && inputs.full_production }}
        run: |
          CHARACTER_V10_ANIMALS=1 node tools/character-forge/qualification-v10.mjs
          for animal in horse rider elephant-crew; do
            ffmpeg -hide_banner -loglevel error -y -framerate 24 -i "$CHARACTER_EVIDENCE/v10-$animal-motion/%02d.png" -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v10-$animal-walk.mp4"
          done
      - name: Required actual source elephant anatomy, foot contact and secondary motion
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: |
          apt-get install -y --no-install-recommends librsvg2-bin ffmpeg
          python3 tools/character-forge/animal-source.py
          CHARACTER_V9_FOCUS=1 CHARACTER_V12_COMPOSITE=1 node tools/character-forge/animal-source.mjs
          CHARACTER_BRIDGE_INPUT="$CHARACTER_EVIDENCE/source-v9-elephant-active.glb" CHARACTER_BRIDGE_LABEL=v9-elephant python3 tools/character-forge/forge-bridge.py
          for f in "$CHARACTER_EVIDENCE"/source-*.svg; do rsvg-convert "$f" -o "${f%.svg}.png"; done
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i "$CHARACTER_EVIDENCE/source-v9-elephant-motion/%02d.png" -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/source-v9-elephant-walk.mp4"
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -i "$CHARACTER_EVIDENCE/v12-elephant-source-crew/%02d.png" -frames:v 12 -c:v libx264 -pix_fmt yuv420p "$CHARACTER_EVIDENCE/v12-elephant-source-crew.mp4"
      - name: Enforce independent isolated grip result (no shield production)
        if: ${{ !cancelled() && env.BLENDER != '' }}
        run: |
          node -e 'const a=require(process.env.CHARACTER_EVIDENCE+"/v15-hand-independent.json"),r=require(process.env.CHARACTER_EVIDENCE+"/morph/v11-grip-report.json"),s=require(process.env.CHARACTER_EVIDENCE+"/v15-reference-poses.json");if(!a.agreement||!s.poses.length||!r.accepted){console.error("Independent reference / anatomy / isolated grip gate rejected: "+r.reason);process.exit(1)}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-roundtrip
          path: |
            quality-artifacts/character-bridge/roundtrip-*
            quality-artifacts/character-bridge/forge-*.log
            quality-artifacts/character-bridge/sprite-*.*
            quality-artifacts/character-bridge/cloth-*
            quality-artifacts/character-bridge/garment-exact-overlap.json
            quality-artifacts/character-bridge/v7-*-overlap-map.png
            quality-artifacts/character-bridge/v8-garment-overlap.json
            quality-artifacts/character-bridge/v9-*
            quality-artifacts/character-bridge/v10-*
            quality-artifacts/character-bridge/v11-*
            quality-artifacts/character-bridge/v12-*
            quality-artifacts/character-bridge/v13-*
            quality-artifacts/character-bridge/v14-*
            quality-artifacts/character-bridge/v15-*
            quality-artifacts/character-bridge/v16-*
            quality-artifacts/character-bridge/v17-*
            quality-artifacts/character-bridge/animal-source-*
            quality-artifacts/character-bridge/source-*
            quality-artifacts/character-bridge/*-source-morphs.png
          retention-days: 14
  studio:
    needs: morph-source
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local browser test
        run: npm install --no-save --legacy-peer-deps --no-package-lock --no-audit --no-fund playwright@1.64.0
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-morph-v9
          path: quality-artifacts/studio-source
      - name: Exercise actual studio controls, garment layers and export
        run: CHARACTER_SOURCE_DIR="$PWD/quality-artifacts/studio-source" node tools/character-forge/studio-test.mjs quality-artifacts/character-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-studio
          path: quality-artifacts/character-studio
          retention-days: 14
