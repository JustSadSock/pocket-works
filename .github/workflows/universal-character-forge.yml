name: Universal Character Forge Research
on:
  pull_request:
    paths:
      - 'tools/character-forge/**'
      - 'docs/UNIVERSAL-CHARACTER-FORGE.md'
      - '.github/workflows/universal-character-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-forge-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHARACTER_EVIDENCE: ${{ github.workspace }}/quality-artifacts/character-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify geometry, skinning, determinism, composition and budgets
        run: node --test tools/character-forge/core.test.mjs tools/character-forge/v2.test.mjs tools/character-forge/v3.test.mjs tools/character-forge/v4.test.mjs
      - name: Produce focused morphology, animal and sprite candidates
        run: node tools/character-forge/native-v4.mjs
      - name: Compare actual pinned CMU motion
        run: |
          python3 tools/character-forge/fetch-control-motion.py
          node tools/character-forge/capture-v4.mjs
      - name: Convert original previews to PNG and video
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin python3-pil ffmpeg fonts-dejavu-core
          python3 tools/character-forge/evidence-v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-core
          path: quality-artifacts/character-forge
          retention-days: 14
  browser:
    needs: core
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-core
          path: quality-artifacts/character-forge
      - name: Install isolated comparison tools without modifying lockfile
        run: npm install --no-save --legacy-peer-deps --no-package-lock --no-audit --no-fund playwright@1.64.0 three@0.180.0
      - name: Actual native GLB and Canvas group probes
        run: node tools/character-forge/sprite-browser.mjs quality-artifacts/character-forge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-browser
          path: |
            quality-artifacts/character-forge/sprite-browser.json
            quality-artifacts/character-forge/sprite-5000-*.png
          retention-days: 14
  morph-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHARACTER_EVIDENCE: ${{ github.workspace }}/quality-artifacts/character-morph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import MakeHuman source skin, morphs and original weights
        run: |
          python3 tools/character-forge/makehuman-adapter.py
          node tools/character-forge/makehuman-export.mjs
          CHARACTER_EVIDENCE_SOURCE="$CHARACTER_EVIDENCE" node --test tools/character-forge/v4.test.mjs
          node tools/character-forge/garment-research.mjs
      - name: Render original human comparison boards
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin python3-pil ffmpeg
          python3 tools/character-forge/evidence-v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-morph
          path: quality-artifacts/character-morph
          retention-days: 14
  art-forge-bridge:
    needs: [core, morph-source]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CHARACTER_EVIDENCE: ${{ github.workspace }}/quality-artifacts/character-bridge
      BLENDER_VERSION: '5.2.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-core
          path: quality-artifacts/character-bridge
      - uses: actions/download-artifact@v4
        with:
          name: character-forge-morph
          path: quality-artifacts/character-bridge/morph
      - name: Install verified editor
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil xz-utils libgl1 libx11-6 libxi6 libxrender1
          cd /tmp
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          verified=false
          for base in "https://mirror.blender.org/release/Blender5.2" "https://download.blender.org/release/Blender5.2" "https://ftp.nluug.nl/pub/graphics/blender/release/Blender5.2"; do
            rm -f "$archive" blender.sha256
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256" &&
               curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "$archive" "$base/$archive" &&
               grep -E "[[:space:]]\\*?${archive}$" blender.sha256 | sha256sum --check --strict; then
              verified=true
              break
            fi
          done
          test "$verified" = true
          tar -xf "$archive"
          echo "BLENDER=/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Re-import original composite creature through Universal Art Forge v2
        run: |
          status=0
          python3 tools/character-forge/forge-bridge.py || status=1
          CHARACTER_BRIDGE_INPUT="$CHARACTER_EVIDENCE/morph/makehuman-base.glb" CHARACTER_BRIDGE_LABEL=makehuman python3 tools/character-forge/forge-bridge.py || status=1
          exit "$status"
      - name: Compare one matched transparent frame through existing Art Forge bake
        if: always()
        run: python3 tools/character-forge/sprite-bake.py
      - name: Optional Blender garment intersections and cloth control
        if: always()
        run: '"$BLENDER" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/character-forge/cloth-study.py'
      - name: Optional actual source animal template experiment
        if: always()
        run: |
          apt-get install -y --no-install-recommends librsvg2-bin ffmpeg
          python3 tools/character-forge/animal-source.py
          node tools/character-forge/animal-source.mjs
          for f in "$CHARACTER_EVIDENCE"/source-*.svg; do rsvg-convert "$f" -o "${f%.svg}.png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-roundtrip
          path: |
            quality-artifacts/character-bridge/roundtrip-*
            quality-artifacts/character-bridge/forge-*.log
            quality-artifacts/character-bridge/sprite-*.*
            quality-artifacts/character-bridge/cloth-*
            quality-artifacts/character-bridge/garment-exact-overlap.json
            quality-artifacts/character-bridge/animal-source-*
            quality-artifacts/character-bridge/source-*
            quality-artifacts/character-bridge/*-source-morphs.png
          retention-days: 14
  studio:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local browser test
        run: npm install --no-save --legacy-peer-deps --no-package-lock --no-audit --no-fund playwright@1.64.0
      - name: Exercise actual studio controls and export
        run: node tools/character-forge/studio-test.mjs quality-artifacts/character-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-forge-studio
          path: quality-artifacts/character-studio
          retention-days: 14
