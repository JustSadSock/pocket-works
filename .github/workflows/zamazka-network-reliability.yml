name: ZAMAZKA network reliability

on:
  push:
    branches: [main]
    paths:
      - 'apps/zamazka/server/module.ts'
      - 'apps/zamazka/draft-transfer.js'
      - 'apps/zamazka/qa/draft-delta-transfer.mjs'
      - 'apps/zamazka/app.js'
      - 'apps/zamazka/qa/final-transfer-recovery.mjs'
      - 'apps/zamazka/qa/eight-player-transfer.mjs'
      - 'apps/zamazka/qa/full-match-recovery.mjs'
      - 'apps/zamazka/editor.js'
      - 'apps/zamazka/qa/editor-raster-invalidation.mjs'
      - 'apps/zamazka/qa/editor-geometry-compaction.mjs'
      - 'apps/zamazka/qa/editor-budget-soak.mjs'
      - 'apps/zamazka/qa/smudge-pixel-parity.mjs'
      - 'apps/zamazka/qa/fill-raster-region.mjs'
      - 'apps/zamazka/fill-raster-region.js'
      - 'apps/zamazka/qa/editor-frame-reuse.mjs'
      - 'apps/zamazka/qa/large-painting.mjs'
      - 'pocketnet/hub.mjs'
      - 'pocketnet/room-join-view.mjs'
      - 'pocketnet/qa/room-join-view.test.mjs'
      - 'pocketnet/disconnect-presence.mjs'
      - 'pocketnet/qa/disconnect-presence.test.mjs'
      - 'pocketnet/art-storage.mjs'
      - 'pocketnet/qa/art-storage.test.mjs'
      - 'pocketnet/zamazka-presence.mjs'
      - 'pocketnet/qa/zamazka-presence.test.mjs'
      - 'pocketnet/modules.lock.json'
      - 'pocketnet/module-versions/zamazka/**'
      - '.github/workflows/zamazka-network-reliability.yml'
  pull_request:
    paths:
      - 'apps/zamazka/server/module.ts'
      - 'apps/zamazka/draft-transfer.js'
      - 'apps/zamazka/qa/draft-delta-transfer.mjs'
      - 'apps/zamazka/app.js'
      - 'apps/zamazka/qa/**'
      - 'pocketnet/hub.mjs'
      - 'pocketnet/room-join-view.mjs'
      - 'pocketnet/qa/room-join-view.test.mjs'
      - 'pocketnet/disconnect-presence.mjs'
      - 'pocketnet/qa/disconnect-presence.test.mjs'
      - 'pocketnet/art-storage.mjs'
      - 'pocketnet/qa/art-storage.test.mjs'
      - 'pocketnet/zamazka-presence.mjs'
      - 'pocketnet/qa/zamazka-presence.test.mjs'
      - 'pocketnet/modules.lock.json'
      - 'pocketnet/module-versions/zamazka/**'
      - '.github/workflows/zamazka-network-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zamazka-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated TypeScript test dependency
        run: |
          mkdir -p "$RUNNER_TEMP/zamazka-ci" node_modules
          printf '{"name":"zamazka-reliability-qa","private":true}' > "$RUNNER_TEMP/zamazka-ci/package.json"
          npm install --prefix "$RUNNER_TEMP/zamazka-ci" --no-package-lock --ignore-scripts --no-audit --no-fund typescript@5.9.3
          ln -s "$RUNNER_TEMP/zamazka-ci/node_modules/typescript" node_modules/typescript
      - name: Test secure room join projection
        run: node --test pocketnet/qa/room-join-view.test.mjs pocketnet/qa/disconnect-presence.test.mjs pocketnet/qa/art-storage.test.mjs pocketnet/qa/zamazka-presence.test.mjs
      - name: Verify immutable PocketNet module snapshot
        run: npm run pocketnet:check
      - name: Prevent stale fill raster after stroke compaction
        run: node apps/zamazka/qa/editor-raster-invalidation.mjs
      - name: Preserve line corners during brush budget compaction
        run: node apps/zamazka/qa/editor-geometry-compaction.mjs
      - name: Check dense 24k-point brush budget without geometry loss
        run: node apps/zamazka/qa/editor-budget-soak.mjs
      - name: Verify flood-fill ROI against full-sized pixel reference
        run: node apps/zamazka/qa/fill-raster-region.mjs
      - name: Verify smudge pixel parity and measured rendering time
        run: node apps/zamazka/qa/smudge-pixel-parity.mjs
      - name: Verify compositor reuse under 60 brush revisions and 120 pointer frames
        run: node apps/zamazka/qa/editor-frame-reuse.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check apps/zamazka/app.js
          node --check apps/zamazka/draft-transfer.js
          node --check pocketnet/hub.mjs
      - name: Test large paintings and frame limits
        run: node apps/zamazka/qa/large-painting.mjs
      - name: Verify acknowledged draft suffix transfer and full fallback
        run: node apps/zamazka/qa/draft-delta-transfer.mjs
      - name: Test checksum and interrupted final recovery
        run: node apps/zamazka/qa/final-transfer-recovery.mjs
      - name: Test eight interleaved final submissions
        run: node apps/zamazka/qa/eight-player-transfer.mjs
      - name: Soak eight seats through three voting and restoration rounds
        run: node apps/zamazka/qa/full-match-recovery.mjs
      - name: Endure five full rounds with eight seats
        run: ZAMAZKA_SOAK_ROUNDS=5 node apps/zamazka/qa/full-match-recovery.mjs
