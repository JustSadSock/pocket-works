name: Black Bazaar Mobile Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'apps/black-bazaar/**'
      - 'scripts/qa-black-bazaar-mobile.mjs'
      - '.github/workflows/black-bazaar-mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bazaar-mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright client
        run: npm install --prefix /tmp/bazaar-playwright --no-save --no-audit --no-fund playwright@1.64.0
      - name: Run authoritative market and isolated UI fixture tests
        run: node --test apps/black-bazaar/mechanics.test.mjs apps/black-bazaar/debug-state.test.mjs apps/black-bazaar/feedback.test.mjs apps/black-bazaar/inbox.test.mjs apps/black-bazaar/bootstrap.test.mjs
      - name: Start local static preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bazaar-preview.log 2>&1 &
      - name: Audit 98 viewport and scene combinations
        env:
          BAZAAR_PLAYWRIGHT_MODULE: file:///tmp/bazaar-playwright/node_modules/playwright/index.mjs
        run: node scripts/qa-black-bazaar-mobile.mjs
      - name: Upload failed screenshots and all measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-bazaar-mobile-report
          path: qa-artifacts/black-bazaar-mobile/
          retention-days: 14
          if-no-files-found: warn
