name: Fog original PocketNet v2 verification
on:
  push:
    branches: [app/fog-of-conquest-port-20261018]
    paths: [.github/workflows/fog-original-pocketnet-qa.yml]
permissions:
  contents: write
jobs:
  original-rule-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Syntax and source fidelity
        run: |
          node --check apps/fog-of-conquest/js/ui.js
          node --check apps/fog-of-conquest/pocket-online.js
          node --check apps/fog-of-conquest/pocket-adapter.js
          node --test apps/fog-of-conquest/test/original-port.test.mjs apps/fog-of-conquest/test/original-pocketnet.test.mjs
      - name: App registry and release manifest
        run: npm run registry:check
      - name: Remove one-shot runner workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/fog-original-pocketnet-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove completed Fog v2 verification runner'
          git push origin HEAD:app/fog-of-conquest-port-20261018
