<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b1e"><meta name="apple-mobile-web-app-capable" content="yes"><title>ПЕПЕЛЬНЫЙ ДОЗОР</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg"><link rel="stylesheet" href="../../shared/mobile-runtime.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main id="game" class="game" data-app-shell>
<header class="masthead"><a class="back" href="../../" aria-label="В Pocket Works">‹ <span>WORKS</span></a><div class="insignia"><img src="./icons/icon.svg" alt=""><div><strong>ПЕПЕЛЬНЫЙ<br>ДОЗОР</strong><small>АББАТСТВО · НОЧЬ</small></div></div><div class="head-actions"><button id="sound" class="icon-button" aria-label="Выключить звук" type="button">♪</button><button id="pause" class="icon-button" aria-label="Пауза" type="button" disabled>Ⅱ</button></div></header>
<section id="stage" class="stage" aria-label="Поле обороны: ведите пальцем, чтобы направить огонь"><canvas id="world" aria-label="Игровое поле"></canvas>
<div class="scene-top"><div class="meter"><span>ОГОНЬ</span><div class="track"><i id="healthBar"></i></div></div><div class="round"><b id="waveLabel">01 / 05</b><span id="statusLabel">ЗАЩИТА</span></div></div>
<div class="scene-bottom"><div class="kills"><b id="killCount">0</b><span>ИЗГНАНО</span></div><span id="sceneHint">ПОВОРАЧИВАЙ СВЕТ ПАЛЬЦЕМ</span></div>
<div id="panel" class="panel" role="dialog" aria-live="polite"><div class="panel-inner"><div class="seal"><img src="./icons/icon.svg" alt=""></div><p id="panelKicker" class="eyebrow">ПОСЛЕДНИЙ ОГОНЬ</p><h1 id="panelTitle">ПЕПЕЛЬНЫЙ<br>ДОЗОР</h1><p id="panelText">Свет обжигает тьму. Направляй луч пальцем. Колокол отталкивает тех, кто подошёл слишком близко.</p><div id="choices" class="choices" hidden></div><button id="primary" class="primary" type="button" data-native-press>ЗАЖЕЧЬ МАЯК <span>→</span></button><button id="secondary" class="secondary" type="button" hidden>НОВАЯ ИГРА</button><p id="personalBest" class="record"></p></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</section>
<footer class="command"><div class="compass"><div class="needle"></div><span>НАВОДИ ЛУЧ<br>НА ТЕНИ</span></div><button id="bell" class="bell" type="button" disabled><span class="bell-glyph">♟</span><strong id="bellLabel">КОЛОКОЛ</strong><small id="bellTime">ГОТОВ</small><i id="bellFill"></i></button><div class="progress-note"><span>НОЧНОЙ<br>ДОЗОР</span><b id="waveBottom">I</b></div></footer>
</main><script src="./app.js" defer></script><script type="module" src="../../shared/update-manager.js" data-update-manager data-service-worker="./sw.js" data-app-name="Дозор" data-app-version="1.0.1"></script>
</body></html>
