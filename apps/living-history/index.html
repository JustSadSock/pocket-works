<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#263a31"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Живая история"><title>Живая история — Pocket Works</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../shared/mobile-runtime.css"><link rel="stylesheet" href="../../shared/update-manager.css"><link rel="stylesheet" href="../../shared/workshop-mode.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main id="app" class="app-shell" data-app-shell data-fullscreen-app><section id="world" data-gesture-surface aria-label="Карта долины"><canvas id="map" aria-label="Мир"></canvas><div id="map-vignette" aria-hidden="true"></div></section>
<header class="top" data-ui><div class="identity"><a href="../../" class="library" data-app-control aria-label="Вернуться в PocketWorks">‹ <span>Библиотека</span></a><div class="wordmark">ЖИВАЯ <em>ИСТОРИЯ</em><small>ЧЕТЫРЕ ОБЩИНЫ · ЖИВОЙ МИР</small></div></div><div class="clock"><button id="workshop-toggle" type="button" data-workshop-trigger>Диагностика</button><div id="date">Год 1 · Весна</div><div class="status" id="population">Население —</div></div></header>
<div class="scene-actions" data-ui><button id="zoom-plus" aria-label="Приблизить">+</button><button id="zoom-minus" aria-label="Отдалить">−</button><button id="center" aria-label="Вся долина">⌖</button><button id="village-view" aria-label="Приблизить к ближайшему поселению">⌕</button></div>
<aside id="world-label" class="place-label" data-ui>Коснитесь дома или поля</aside>
<section class="deck" data-ui><div class="deck-grip"></div><div class="playbar"><div class="live-mark"><i></i><span id="live-text">МИР ПРИОСТАНОВЛЕН</span></div><div class="speed" role="group" aria-label="Скорость симуляции"><button data-native-press data-speed="0" class="active" aria-label="Пауза">Ⅱ</button><button data-native-press data-speed="0.25">×¼</button><button data-native-press data-speed="0.5">×½</button><button data-native-press data-speed="1">×1</button><button data-native-press data-speed="5">×5</button><button data-native-press data-speed="20">×20</button></div><div id="time-detail" class="time-detail" data-mode="coarse" aria-live="off"><span id="time-stage">Пауза · суточный обзор</span><div class="time-track" aria-hidden="true"><i id="time-fill"></i></div></div></div><div class="tabs" role="tablist"><button data-tab="overview" class="active">Мир</button><button data-tab="household">Семья</button><button data-tab="chronicle">Хроника</button><button data-tab="tools">Данные</button></div><div id="sheet-content" class="sheet-content"></div></section>
<div id="modal" class="dialog-cover" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">Новый мир?</h2><p>Сохранённая долина будет заменена. Можно сначала экспортировать её в JSON.</p><label class="scenario-choice" for="world-scenario">Условия новой долины<select id="world-scenario"><option value="normal">Умеренный климат</option><option value="drought">Засуха на 6–8-м году</option><option value="isolated">Изолированные общины</option><option value="uplands">Бедная горная почва</option></select></label><label class="scenario-choice" for="world-experiment">Экспериментальные коэффициенты<select id="world-experiment"><option value="normal">Базовая модель (×1)</option><option value="yieldLow">Урожайность −15%</option><option value="storageLow">Вместимость амбаров −25%</option><option value="plantingHigh">Планируемый посев +20%</option><option value="transportHigh">Издержки перевозок +50%</option><option value="weatherHigh">Колебания погоды +50%</option></select></label><label class="scenario-choice" for="world-seed">Seed для воспроизводимого мира <input id="world-seed" type="number" min="0" max="4294967295" step="1" inputmode="numeric" placeholder="Случайный, если пусто"></label><div class="dialog-actions"><button id="cancel-reset">Отмена</button><button id="confirm-reset" class="danger">Создать новый</button></div></section></div><div id="toast" class="toast" role="status" aria-live="polite"></div><input id="import-file" type="file" accept=".json,application/json" hidden></main><script type="module" src="../../shared/update-manager.js" data-update-manager data-service-worker="./sw.js" data-app-name="Живая история" data-app-version="0.7.9"></script><script type="module" src="./app.js"></script></body></html>
