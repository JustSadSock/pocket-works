<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e6ddc8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ДИСПУТ">
  <title>ДИСПУТ: ІЕВ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/mobile-runtime.css">
  <link rel="stylesheet" href="../../shared/update-manager.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./learning.css">
  <link rel="stylesheet" href="./full-course.css">
  <link rel="stylesheet" href="./random-trainer.css">
</head>
<body>
  <main class="app-shell" data-app-shell data-fullscreen-app>
    <header class="masthead" data-ui>
      <a class="launcher-link" href="../../" data-app-control data-native-press>← Pocket Works</a>
      <div class="identity"><span>ІСТОРІЯ ЕКОНОМІЧНИХ ВЧЕНЬ</span><strong>ДИСПУТ</strong></div>
      <div class="accuracy"><span id="cycleValue">0/5</span><small>цикл</small></div>
    </header>

    <section class="workbench" id="workbench" data-selectable aria-live="polite"><div class="page"><div class="loading">Готую повний курс…</div></div></section>

    <nav class="bottom-ledger" aria-label="Основна навігація" data-ui>
      <button type="button" data-tab="cycle" data-native-press><span>01</span>Навчання</button>
      <button type="button" data-tab="progress" data-native-press><span>02</span>Прогрес</button>
      <button type="button" data-tab="notes" data-native-press><span>03</span>Конспект</button>
    </nav>
    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
  </main>
  <script src="./course-completion-guard.js"></script>
  <script
    type="module"
    src="../../shared/update-manager.js"
    data-update-manager
    data-service-worker="./sw.js"
    data-app-name="ДИСПУТ: ІЕВ"
    data-app-version="1.4.0"
  ></script>
  <script type="module" src="./full-course-entry.js"></script>
</body>
</html>
