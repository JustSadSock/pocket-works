<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e6ddc8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ДИСПУТ">
  <title>ДИСПУТ: ІЕВ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/mobile-runtime.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell" data-app-shell data-fullscreen-app>
    <header class="masthead" data-ui>
      <a class="launcher-link" href="../../" data-app-control data-native-press>← Pocket Works</a>
      <div class="identity">
        <span class="kicker">Історія економічних вчень</span>
        <strong>ДИСПУТ</strong>
      </div>
      <button class="readiness" type="button" data-action="show-readiness" data-native-press aria-label="Показати готовність">
        <span id="readinessValue">0%</span><small>готовність</small>
      </button>
    </header>

    <section class="workbench" id="workbench" data-selectable aria-live="polite"></section>

    <nav class="bottom-ledger" aria-label="Основна навігація" data-ui>
      <button type="button" data-tab="plan" data-native-press><span>01</span>План</button>
      <button type="button" data-tab="atlas" data-native-press><span>02</span>Атлас</button>
      <button type="button" data-tab="trainer" data-native-press><span>03</span>Тренажер</button>
      <button type="button" data-tab="notes" data-native-press><span>04</span>Конспект</button>
    </nav>

    <section class="overlay" id="overlay" hidden aria-modal="true" role="dialog">
      <div class="overlay-scrim" data-action="close-overlay"></div>
      <article class="overlay-sheet" id="overlaySheet" data-keyboard-aware></article>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
