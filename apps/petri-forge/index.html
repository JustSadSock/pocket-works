<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1719">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PetriForge">
  <title>PetriForge</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="../../shared/mobile-runtime.css">
  <link rel="stylesheet" href="../../shared/update-manager.css">
  <link rel="stylesheet" href="../../shared/workshop-mode.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-app-preset="canvas">
  <main id="wrap" data-app-shell>
  <header><a href="../../" class="exit">Pocket Works</a><strong>PetriForge</strong>
    <button id="playPause">Запустить</button>
    <button id="step">Шаг</button>
    <button id="reset">Сброс</button>
    <span class="pill" id="status">idle</span>
    <div class="spacer"></div>
      <label>Tile:
        <select id="tileSelect">
          <option value="0">EMPTY</option>
          <option value="1">WALL</option>
          <option value="2">GOAL</option>
          <option value="3">HAZARD</option>
          <option value="4">REWARD</option>
        </select>
      </label>
      <label>Tool:
        <select id="toolSelect">
          <option value="brush">Brush</option>
          <option value="rect">Rectangle</option>
          <option value="line">Line</option>
          <option value="fill">Fill</option>
          <option value="pipette">Pipette</option>
          <option value="eraser">Eraser</option>
        </select>
      </label>
      <label>Zoom:
        <select id="zoomSel">
          <option value="0.25">25%</option>
          <option value="0.5">50%</option>
          <option value="1" selected>100%</option>
          <option value="2">200%</option>
        </select>
      </label>
      <button id="save">Сохранить</button>
      <button id="load">Загрузить</button>
      <label>Agent:
        <select id="agentSelect">
          <option value="random">Random</option>
        <option value="qlearning">Q-Learning</option>
      </select>
    </label>
  <button id="undo">Отменить</button><button id="redo">Повторить</button><label>Среда <select id="generate"><option value="">Выбрать…</option><option value="3">Шум</option><option value="4">Лабиринт</option><option value="5">Комнаты</option><option value="6">Остров</option></select></label></header>

    <div id="stage" data-gesture-surface>
      <canvas id="cv" data-gesture-surface aria-label="Среда агента: рисуйте клетки" width="720" height="480"></canvas>
      <canvas id="mini" width="150" height="100"></canvas>
      <div id="ctxmenu"></div>
    </div>

  <div id="hud">
    <div>Steps: <span id="steps">0</span></div>
    <div>Total reward: <span id="trew">0</span></div>
    <div class="spacer"></div>
    <div style="font-size:12px;color:var(--muted)">Перетащите синий старт и зелёную цель. Рисуйте препятствия.</div>
  </div>
</main>

  <script
    type="module"
    src="../../shared/update-manager.js"
    data-update-manager
    data-service-worker="./sw.js"
    data-app-name="PetriForge"
    data-app-version="0.1.0"
  ></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
