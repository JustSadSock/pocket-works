<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#252b25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>СЛЕПАЯ СМЕНА · кооператив вслепую</title>
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg"><link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="../../shared/mobile-runtime.css"><link rel="stylesheet" href="./styles.css">
</head><body><main class="app-shell" data-app-shell data-fullscreen-app>
<header class="masthead" data-ui><a href="../../" class="exit" data-native-press>← Pocket Works</a><div class="brand"><span class="brand-icon">◉</span><span>СЛЕПАЯ СМЕНА</span></div><div id="netStatus" class="connection">НЕТ СОЕДИНЕНИЯ</div></header>
<section class="layout">
<div class="viewport" data-gesture-surface><canvas id="scene" aria-label="Общая заводская комната, где виден только персонаж напарника"></canvas><div class="inset-gloss"></div><div class="scene-label"><strong id="stageTitle">ЦЕХ №1</strong><span id="stageBrief">Твои глаза — у напарника</span></div><div id="gameFlash" class="game-flash" aria-live="polite"></div>
<div class="touch-controls"><div id="touchStick" class="touch-stick" aria-label="Виртуальный джойстик"><span id="stickNub"></span></div><div class="touch-actions"><button id="touchJump" type="button">Прыжок</button><button id="touchHold" type="button">Толкать</button></div></div>
</div>
<aside class="instrument" id="instrument"><div id="panel"></div></aside>
</section>
<footer class="controlbar" data-ui><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> движение</span><span><kbd>Space</kbd> прыжок</span><span><kbd>E</kbd> толкать</span><span><kbd>F</kbd> сигнал</span><span><kbd>Esc</kbd> пауза</span></footer>
<div id="pauseLayer" class="overlay hidden" role="dialog" aria-modal="true"><div class="overlay-body"><h2>ПАУЗА</h2><p>Ты не видишь себя. Напарник по-прежнему тебя видит.</p><button id="resumeBtn" class="button primary">Продолжить · Esc</button><button id="leaveBtn" class="button muted">Покинуть комнату</button><a class="button text-link" href="../../">Вернуться в Pocket Works</a></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script type="module" src="../../shared/update-manager.js" data-update-manager data-service-worker="./sw.js" data-app-name="СЛЕПАЯ СМЕНА" data-app-version="1.0.0"></script>
<script type="module" src="./app.js"></script></body></html>
