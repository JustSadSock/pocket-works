<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10121c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ПАЛОМНИК">
<meta name="description" content="Шагающая крепость сквозь мёртвые небеса."><title>ПАЛОМНИК — последний переход</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/icon.svg">
<link rel="stylesheet" href="../../shared/mobile-runtime.css"><link rel="stylesheet" href="../../shared/update-manager.css"><link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app" data-app-shell data-fullscreen-app id="app">
<section class="world" aria-label="Пиксельная диорама экспедиции">
<canvas id="scene" data-gesture-surface data-block-callout aria-label="Выберите подсвеченную опору для шага"></canvas>
<div class="shading" aria-hidden="true"></div>
<header class="topbar" data-ui>
<a href="../../" class="back" data-native-press data-app-control aria-label="Вернуться в Pocket Works">‹ <span>WORKS</span></a>
<div class="brand"><span class="brand-mark" aria-hidden="true">✠</span><strong>ПАЛОМНИК</strong></div>
<div class="tools">
<button id="sound" type="button" class="tool" data-native-press aria-label="Включить звук">♪</button>
<button id="pause" type="button" class="tool" data-native-press aria-label="Пауза">Ⅱ</button>
</div>
</header>
<div class="hud" id="hud" data-ui hidden><div class="hud-meter"><span class="hud-icon fire">◆</span><div><small>ЖАР</small><strong id="heatText">12</strong></div><div class="meter"><i id="heatFill"></i></div></div><div class="hud-meter armor"><span class="hud-icon">✣</span><div><small>КОРПУС</small><strong id="hullText">3</strong></div><div class="meter"><i id="hullFill"></i></div></div></div>
<div class="waypoint" id="waypoint" data-ui hidden><span id="region">ПЕПЕЛ</span><span id="progress">0 / 21</span></div>
<div id="hint" class="hint" data-ui hidden>Коснись следующей опоры</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="vignette" aria-hidden="true"></div>
<section id="modal" class="modal" data-ui aria-labelledby="modalTitle">
<div class="modal-inner">
<div class="tiny-mark" id="modalEyebrow">ЭКСПЕДИЦИЯ · I</div>
<h1 id="modalTitle">ПАЛОМНИК</h1>
<div class="diamond" aria-hidden="true">✦</div>
<p id="modalBody">Последняя шагающая крепость идёт к маяку за пределами бури. Выбирай опоры. Огонь — твоё время, корпус — твоя жизнь.</p>
<button id="primary" type="button" class="primary" data-native-press>НАЧАТЬ ПУТЬ <span>→</span></button>
<button id="secondary" type="button" class="secondary" data-native-press hidden>НОВАЯ ЭКСПЕДИЦИЯ</button>
<a id="modalExit" href="../../" data-app-control data-native-press>Вернуться в Pocket Works</a>
</div>
</section>
</section>
</main>
<script type="module" src="../../shared/update-manager.js" data-update-manager data-service-worker="./sw.js" data-app-name="ПАЛОМНИК" data-app-version="1.0.0"></script>
<script type="module" src="./app.js"></script>
</body></html>
