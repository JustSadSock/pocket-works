<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233631"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ЛЕНТА">
<title>ЛЕНТА · общая музыка</title><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="../../shared/mobile-runtime.css"><link rel="stylesheet" href="../../shared/capabilities/identity.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main class="app-shell" data-app-shell data-keyboard-aware data-fullscreen-app><header class="top" data-ui><a href="../../" class="library" data-app-control data-native-press>← Pocket Works</a><div class="logo"><span class="logo-icon"><i></i><i></i></span>ЛЕНТА<span class="logo-star">✳</span></div><button id="roomButton" class="room-button" type="button" hidden>Участники <span id="peerCount">1</span></button></header>
<div id="view" class="view"><section class="loading">Загружаем магнитную ленту…</section></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="clipDialog" class="modal"><div class="dialog-sheet"><div class="dialog-head"><p class="eyebrow">РЕДАКТОР МУЗЫКИ</p><button id="closeClip" class="close" aria-label="Закрыть">×</button></div>
<h2 id="clipTitle">Редактор нот</h2><div id="clipPreview" class="clip-preview"></div>
<div class="step-title"><b>Ноты и ритм</b><small>Нажми на клетку, чтобы добавить или удалить звук</small></div>
<div id="patternBars" class="pattern-bars"></div><div id="patternHalves" class="pattern-halves"></div>
<div id="patternGrid" class="pattern-grid" role="group" aria-label="Пошаговый редактор"></div>
<div class="note-controls"><label>Длина ноты <select id="noteLength"><option value="1">1 шаг</option><option value="2">2 шага</option><option value="4">4 шага</option><option value="8">8 шагов</option></select></label>
<label>Сила звука <input id="noteVelocity" type="range" min="20" max="100" step="10" value="80"></label></div>
<details class="trim-details"><summary>Обрезать фрагмент</summary><div class="range-caption"><span>Начало</span><b id="trimStartLabel">1</b></div><input id="trimStart" type="range" min="0" max="63" value="0">
<div class="range-caption"><span>Конец</span><b id="trimEndLabel">64</b></div><input id="trimEnd" type="range" min="1" max="64" value="64"></details>
<div class="dialog-actions"><button id="deleteClip" class="action secondary danger">Удалить</button><button id="duplicateClip" class="action secondary">Копировать</button><button id="saveClip" class="action primary">Сохранить</button></div></div></dialog>
<dialog id="confirmDialog" class="modal"><div class="dialog-sheet"><h2>Новая лента?</h2><p>Композиция очистится у всей группы. Сначала экспортируй WAV, если хочешь сохранить звук.</p><div class="dialog-actions"><button id="cancelReset" class="action secondary">Отмена</button><button id="confirmReset" class="action primary danger">Очистить</button></div></div></dialog>
</main><script type="module" src="../../shared/update-manager.js" data-update-manager data-service-worker="./sw.js" data-app-name="ЛЕНТА" data-app-version="2.0.0"></script><script type="module" src="./app.js"></script></body></html>
