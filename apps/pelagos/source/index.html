<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#081719">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PELAGOS">
  <meta name="pocket-works-build" content="1.5.0">
  <title>PELAGOS — Pocket Works</title>
</head>
<body data-fullscreen-app>
  <main id="app" class="pelagos" data-app-shell data-fullscreen-app>
    <canvas id="renderCanvas" aria-label="Корабль в открытом море" data-gesture-surface data-block-callout></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header id="hud" class="hud hidden" data-ui>
      <div class="wind-dial" aria-label="Направление ветра">
        <i id="windArrow" aria-hidden="true"></i>
        <span><b id="windValue">8.2</b><small>М/С</small></span>
      </div>
      <button id="pauseButton" class="circle-button" type="button" aria-label="Пауза">Ⅱ</button>
    </header>

    <section id="telemetry" class="telemetry hidden" data-ui>
      <span><b id="speedValue">0.0</b><small>УЗЛА</small></span>
      <span class="course"><i id="courseNeedle" aria-hidden="true"></i><small id="courseValue">000°</small></span>
      <span><b id="weatherValue">БРИЗ</b><small>МОРЕ</small></span>
    </section>

    <section id="controls" class="controls hidden" data-ui>
      <div id="helmZone" class="helm-zone" data-gesture-surface data-block-callout aria-label="Руль: проведи влево или вправо">
        <div class="helm-track"><i id="helmKnob"></i></div>
        <span>РУЛЬ</span>
      </div>
      <button id="rowButton" class="row-button" type="button" data-block-callout aria-label="Грести">ГРЕСТИ</button>
      <div id="sailZone" class="sail-zone" data-gesture-surface data-block-callout aria-label="Парус: проведи вверх или вниз">
        <div class="sail-track"><i id="idealTrim"></i><i id="sailKnob"></i></div>
        <span>ПАРУС</span>
      </div>
    </section>

    <section id="startScreen" class="start-screen" data-ui>
      <div class="start-copy">
        <p class="eyebrow">POCKET WORKS / OPEN SEA</p>
        <h1>PELAGOS</h1>
        <p>Ветер, волна и один корабль. Без рельсов.</p>
      </div>
      <button id="startButton" class="primary-button" type="button">ВЫЙТИ В МОРЕ</button>
      <button id="settingsButton" class="text-button" type="button">НАСТРОЙКИ</button>
    </section>

    <section id="pauseScreen" class="overlay hidden" data-ui aria-hidden="true">
      <div class="panel">
        <p class="eyebrow">ДРЕЙФ</p>
        <h2>Пауза</h2>
        <button id="resumeButton" class="primary-button" type="button">ПРОДОЛЖИТЬ</button>
        <button id="pauseSettingsButton" class="text-button" type="button">НАСТРОЙКИ</button>
        <button id="exitButton" class="text-button" type="button">ВЫЙТИ</button>
      </div>
    </section>

    <section id="settingsScreen" class="overlay hidden" data-ui aria-hidden="true">
      <div class="panel settings-panel">
        <div class="panel-head">
          <div><p class="eyebrow">PELAGOS</p><h2>Настройки</h2></div>
          <button id="closeSettingsButton" class="circle-button" type="button" aria-label="Закрыть">×</button>
        </div>
        <label class="setting-row"><span>Звук</span><input id="soundToggle" type="checkbox" checked></label>
        <label class="setting-row"><span>Качество</span><select id="qualitySelect"><option value="auto">Авто</option><option value="high">Высокое</option><option value="medium">Среднее</option><option value="low">Низкое</option></select></label>
        <button id="resetButton" class="danger-button" type="button">СБРОСИТЬ ПРОГРЕСС</button>
      </div>
    </section>

    <section id="onboarding" class="onboarding hidden" data-ui aria-live="polite">
      <p id="onboardingText"></p>
      <button id="onboardingNext" class="primary-button" type="button">ПОНЯТНО</button>
    </section>

    <div id="bootStatus" class="boot-status" role="status">Море собирается…</div>
  </main>
  <script type="module" src="/main.ts"></script>
</body>
</html>
