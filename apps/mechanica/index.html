<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171e20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>МЕХАНИКА — Мастерская часовщика</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg"><link rel="stylesheet" href="../../shared/mobile-runtime.css"><link rel="stylesheet" href="../../shared/update-manager.css"><link rel="stylesheet" href="./styles.css">
</head><body data-app-preset="canvas">
<main class="machine" data-app-shell>
  <header class="masthead">
    <a class="back machined-key" href="../../" aria-label="Вернуться в библиотеку Pocket Works">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7M8 12h12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="brand"><div class="brand-kicker">ATELIER · M — 01</div><h1>МЕХАНИКА</h1><small>МАСТЕРСКАЯ ЧАСОВЩИКА</small></div>
    <button id="sound" class="sound machined-key" type="button" aria-label="Выключить звук" aria-pressed="true" title="Звук">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 14V8l5-3v10.4M10 8l7-2v10M5 14c-2.4 0-3.4 1.8-2 3.2 1.7 1.4 4.3-.3 4.3-2M17 16c-2.3-.1-3.6 1.9-2.3 3.2 1.6 1.5 4.3.3 4.3-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <section class="instrument" aria-label="Механический станок">
    <div class="instrument-cap">
      <div class="plate-name"><span class="plate-serial">Nº 01</span><span class="plate-rule"></span><span>ТЕХНИЧЕСКИЙ СТОЛ</span></div>
      <div id="link-indicator" class="link-indicator" aria-live="polite"><span class="signal-lamp"></span><span id="link-label">ПРИВОД РАЗОМКНУТ</span></div>
    </div>

    <div class="stage">
      <canvas id="board" aria-label="Механическая передача. Выберите деталь снизу и коснитесь гнезда."></canvas>
      <div class="stage-heading"><span id="chapter">СХЕМА I</span><strong id="puzzle-title">ПЕРЕДАЧА</strong><span id="goal">ПРОВЕДИ ВРАЩЕНИЕ</span></div>
      <div class="hintline" id="hintline" role="status" aria-live="polite">Выбери шестерню и установи её в гнездо</div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <div class="deck">
      <div class="deck-heading"><span class="engraved-title">I. КАССЕТА ДЕТАЛЕЙ</span><span id="stock-label">НАЖМИ И УСТАНОВИ</span></div>
      <div class="console">
        <div class="parts" role="group" aria-label="Выбор размера шестерни">
          <button class="part" data-size="1" type="button" aria-pressed="false" aria-label="Малая шестерня">
            <span class="part-rim"><span class="cog cog-small" aria-hidden="true"></span></span><span class="part-label">МАЛАЯ</span><span class="part-count" data-count="1">0</span>
          </button>
          <button class="part active" data-size="2" type="button" aria-pressed="true" aria-label="Средняя шестерня">
            <span class="part-rim"><span class="cog cog-middle" aria-hidden="true"></span></span><span class="part-label">СРЕДНЯЯ</span><span class="part-count" data-count="2">3</span>
          </button>
          <button class="part" data-size="3" type="button" aria-pressed="false" aria-label="Большая шестерня">
            <span class="part-rim"><span class="cog cog-large" aria-hidden="true"></span></span><span class="part-label">БОЛЬШАЯ</span><span class="part-count" data-count="3">0</span>
          </button>
        </div>

        <div class="power">
          <button id="wind" class="action winding" type="button" aria-label="Завести пружину">
            <span class="wind-dial" aria-hidden="true"><span class="wind-crank"><span class="wind-grip"></span></span></span>
            <span class="action-text"><b>ЗАВЕСТИ</b><small id="charge-read">ПРУЖИНА · 100%</small></span>
          </button>
          <button id="run" class="action launch" type="button" aria-label="Запустить механизм">
            <span class="switch-bezel" aria-hidden="true"><span class="starter-lamp"></span><span class="switch-paddle"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor"/></svg></span></span>
            <span class="action-text"><b>ПУСК</b><small id="run-caption">ИСПЫТАТЬ</small></span>
          </button>
        </div>

        <div class="utilities" role="group" aria-label="Инструменты">
          <button id="undo" class="utility-button" type="button" aria-label="Отменить" title="Отменить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7H3l4-4M3 7a9 9 0 1 1 2 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ШАГ</span>
          </button>
          <button id="clear" class="utility-button" type="button" aria-label="Очистить схему" title="Очистить схему">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7Zm-2 0h16M9 7V4h6v3M10 11v7m4-7v7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>СБРОС</span>
          </button>
          <button id="levels" class="utility-button books-button" type="button" aria-label="Выбрать чертёж" title="Чертежи">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h15v18H4zM7 7h9M7 10h9M7 14h6M2 6v13M7 3v18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>СХЕМЫ</span>
          </button>
        </div>
      </div>
      <div class="deck-foot"><span class="status-jewel" aria-hidden="true"></span><span id="gear-status">ВЫХОД · НЕТ СОЕДИНЕНИЯ</span><span class="folio">ЛИСТ <span id="case-index">01</span> / 06</span></div>
    </div>
  </section>

  <div id="modal" class="modal" hidden><div class="modal-scrim" data-close="true"></div><section class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="modal-content"></div></section></div>
</main>
<script type="module" src="../../shared/update-manager.js" data-update-manager data-service-worker="./sw.js" data-app-name="МЕХАНИКА" data-app-version="1.1.0"></script>
<script type="module" src="./app.js"></script>
</body></html>
