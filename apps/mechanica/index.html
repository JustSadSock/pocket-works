<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173e40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>МЕХАНИКА — Мастерская машин</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg"><link rel="stylesheet" href="../../shared/mobile-runtime.css"><link rel="stylesheet" href="../../shared/update-manager.css"><link rel="stylesheet" href="./styles.css">
</head><body data-app-preset="canvas">
<main class="machine" data-app-shell>
<header class="masthead">
<a class="back" href="../../" aria-label="В библиотеку Pocket Works">‹ <span>БИБЛИОТЕКА</span></a>
<div class="brand"><div class="brand-ornament">✶</div><h1>МЕХАНИКА</h1><small>МАСТЕРСКАЯ ЧУДЕСНЫХ МАШИН</small></div>
<button id="sound" class="sound" type="button" aria-label="Переключить звук">♪</button>
</header>
<section class="instrument" aria-label="Мастерская">
<div class="instrument-cap"><span class="serial">M·01 / ЛАБОРАТОРИЯ</span><button id="levels" class="plate-button" type="button">СХЕМЫ ▤</button></div>
<div class="stage">
<canvas id="board" aria-label="Станок. Касайтесь гнёзд, чтобы установить выбранную шестерню."></canvas>
<div class="stage-heading"><span id="chapter">СХЕМА I</span><strong id="puzzle-title">ПЕРЕДАЧА</strong><span id="goal">СОЕДИНИ ВАЛЫ</span></div>
<div class="hintline" id="hintline" role="status" aria-live="polite">Выбери деталь и коснись свободного гнезда.</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div class="deck">
<div class="tool-heading"><span>НАБОР ДЕТАЛЕЙ</span><span id="stock-label">ВЫБЕРИ И ПОСТАВЬ</span></div>
<div class="parts" role="group" aria-label="Размер шестерни">
<button class="part" data-size="1" type="button" aria-pressed="false"><span class="cog cog-small" aria-hidden="true"></span><span class="part-label">МАЛАЯ</span><span class="part-count" data-count="1"></span></button>
<button class="part active" data-size="2" type="button" aria-pressed="true"><span class="cog cog-middle" aria-hidden="true"></span><span class="part-label">СРЕДНЯЯ</span><span class="part-count" data-count="2"></span></button>
<button class="part" data-size="3" type="button" aria-pressed="false"><span class="cog cog-large" aria-hidden="true"></span><span class="part-label">БОЛЬШАЯ</span><span class="part-count" data-count="3"></span></button>
</div>
<div class="switches">
<button id="undo" class="square-button" type="button" aria-label="Отменить" title="Отменить">↶</button>
<button id="wind" class="action winding" type="button"><span class="action-symbol">⟳</span><span><b>ЗАВЕСТИ</b><small id="charge-read">ПРУЖИНА · 100%</small></span></button>
<button id="run" class="action launch" type="button"><span class="action-symbol">▶</span><span><b>ПУСК</b><small id="run-caption">ИСПЫТАТЬ МАШИНУ</small></span></button>
<button id="clear" class="square-button" type="button" aria-label="Очистить" title="Очистить">⌫</button>
</div>
<div class="deck-foot"><span id="gear-status">ВЫХОД · НЕТ СОЕДИНЕНИЯ</span><span>№ <span id="case-index">01</span> / 06</span></div>
</div>
</section>
<div id="modal" class="modal" hidden><div class="modal-scrim" data-close="true"></div><section class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="modal-content"></div></section></div>
</main>
<script type="module" src="../../shared/update-manager.js" data-update-manager data-service-worker="./sw.js" data-app-name="МЕХАНИКА" data-app-version="1.0.0"></script>
<script type="module" src="./app.js"></script>
</body></html>
